# VENDORED COPY. The source of truth is
# `Astra/astra-rs/astra-plugin-manifest/`; `src/` and `README.md` here are
# byte-identical to it and `tools/check-manifest-crate.sh` fails when they are
# not. Edit upstream, then run `tools/check-manifest-crate.sh --sync`.
#
# This file is the ONE thing that legitimately differs, because this copy is not
# in Astra's cargo workspace: versions are spelled out instead of inherited, and
# `astra-host` is declared-but-empty (see [features]). The check script compares
# the two files on their dependency NAMES, so a dependency added upstream and
# forgotten here is still a CI failure.
#
# PUBLISHED FROM HERE, to crates.io, because the CLI is. `cargo publish` of
# `astra-plugin-cli` strips the `path` from its dependency on this crate and
# resolves the `version` from crates.io, so this crate goes up first, from this
# copy, in `release-cli.yml`'s crates.io job. Astra's copy is not the one
# published: it inherits its versions from Astra's workspace, and its
# `astra-host` feature pulls `astra-core`, which is not on crates.io. The daemon
# keeps building from its own path; nothing in Astra depends on this upload.
#
# So `version` below is bumped HERE, by hand, whenever a sync changes `src/`,
# and the CLI's requirement on it moves with it. C37
# (`tools/check-crates-publish.py`) compares crates.io's copy of this version
# with these bytes and is red on a sync that forgot the bump. Without that, the
# next CLI release would find the version already published, skip it, and ship
# a crates.io CLI that parses `plugin.toml` with the older code while the
# release binaries use the newer.
[package]
name = "astra-plugin-manifest"
version = "0.1.0"
edition = "2024"
authors = ["Astra Team"]
license = "MPL-2.0"
description = "The `plugin.toml` manifest: one definition, shared by the daemon, the CLI and the registry bot"
# What crates.io shows, and what cargo warns about without. None of it changes
# the build. The three URLs are the CLI's, the one canonical set this
# repository uses (astra-plugin-cli/Cargo.toml says why there is one).
repository = "https://github.com/mihailinl/AstraPlugins"
homepage = "https://github.com/mihailinl/AstraPlugins"
documentation = "https://github.com/mihailinl/AstraPlugins/tree/master/docs/en"
readme = "README.md"
# `edition = "2024"` sets the floor at Rust 1.85, as it does for the CLI.
rust-version = "1.85"
keywords = ["astra", "plugin", "manifest", "toml"]
categories = ["config", "parser-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
semver = "1"

[features]
# Declared so `#[cfg(feature = "astra-host")]` in the shared sources is a known
# cfg here rather than an `unexpected_cfgs` warning — and EMPTY, because
# `astra-plugin` is not an Astra. The daemon's copy enables it by default and it
# pulls `astra_core::VERSION`; in this copy there is no astra-core to point at,
# and enabling it is a compile error rather than a silently wrong answer.
#
# What that means for `plugin.min_astra_version`: `astra-plugin check` validates
# its SYNTAX (an unparseable value is a constraint that constrains nothing) but
# never refuses a plugin for targeting a newer daemon than the CLI's own build.
default = []
astra-host = []
