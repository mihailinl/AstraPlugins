[package]
name = "astra-plugin-cli"
# 0.2.0, not 0.1.4: `validate` became `check`, `create` became `new`, and `dev`
# stopped self-spawning the plugin in favour of driving the daemon. Every one of
# those breaks a script written against 0.1.x.
#
# 0.2.1 carries two fixes and no API change: the `init-ci` annotated-tag fix
# (5b8ab22), and `publish --notify`, whose URL now names the registry's
# release-ping issue template — the registry disabled blank issues, and a link
# without a `template=` is redirected to the chooser with every prefilled field
# dropped.
#
# It is a version bump *because* a build cannot otherwise be told apart from a
# broken one: 0.2.0 pinned a tag object where a commit was required, every
# author's first release died, and `astra-plugin --version` said `0.2.0` on both
# sides of the fix. A user reporting that bug, and a maintainer reading the
# report, need one number that answers "which build is this".
#
# 0.3.0, not 0.2.2, and the reason is a refusal rather than a rename. `check`
# and `build` gained E20 and E21, and `build` gained the artifact-size cap: a
# `plugin.toml` that packed under the 0.2.1 binaries on the `cli-v0.2.1` release
# can now fail, so a script pinned to "astra-plugin build succeeds" breaks on the
# upgrade. `locales.lock.json` also changed shape — every key gets an entry now,
# seeds included — so the first `locale sync` after the upgrade rewrites a lock
# 0.2.1 wrote. Per docs/en/versioning.md's 0.x reading, "may break" is the minor
# slot. The whole `locale` command group and `new` seeding `locales/en.json` are
# additions and would have been a patch on their own.
version = "0.3.0"
edition = "2024"
description = "CLI tool for developing Astra plugins"
license = "GPL-3.0-or-later"
# ONE canonical URL, everywhere. This field used to name a GitHub organisation
# that does not exist and returns 404, while the SDK next door named
# `mihailinl/AstraPlugins` — the real `origin` remote — and the docs named a
# third. Three names for one repository is three chances to send a reader
# nowhere, so every `repository`, `homepage` and `documentation` field in this
# tree now agrees with the line below, and a grep for the dead two comes back
# empty.
repository = "https://github.com/mihailinl/AstraPlugins"
homepage = "https://github.com/mihailinl/AstraPlugins"
documentation = "https://github.com/mihailinl/AstraPlugins/tree/master/docs/en"
# Everything below is metadata a crates.io publish wants and this crate did not
# have. It changes nothing about the build.
#
# `readme` is what crates.io renders as the crate's front page. Cargo would
# default to README.md anyway; it is spelled out because the file is load-bearing
# — it is the install instructions, and it is also shipped inside every binary
# archive `.github/workflows/release-cli.yml` builds.
readme = "README.md"
# The graph's own floor, not a guess: `edition = "2024"` requires Rust 1.85, and
# the highest `rust-version` declared by anything in Cargo.lock is also 1.85
# (hashbrown 0.17.1, clap 4.6.1, indexmap 2.14.0 — `cargo metadata --locked`).
# Without this field, an author on an older toolchain gets a parse error inside a
# dependency; with it, cargo says which version is needed before compiling
# anything.
rust-version = "1.85"
# crates.io search. Five is the maximum; `astra` and `plugin` are what someone
# who has been handed a plugin to fix would actually type.
keywords = ["astra", "plugin", "cli", "scaffold", "sdk"]
# From crates.io's fixed category list — an unknown slug is rejected at upload.
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "astra-plugin"
path = "src/main.rs"

[dependencies]
# `plugin.toml`, parsed by the daemon's own code. VENDORED from
# Astra/astra-rs/astra-plugin-manifest — see that crate's README for why it is
# copied rather than published, and tools/check-manifest-crate.sh for the check
# that fails when the copy drifts. This CLI used to keep its own struct; it grew
# a `ui_panels` capability the daemon has never had, serde dropped the unknown
# key, and three shipped examples declared no capabilities at all.
astra-plugin-manifest = { path = "vendor/astra-plugin-manifest" }
# `astra-plugin test` is the SDK's own level-2 harness pointed at a process
# instead of at a type. It reuses `astra_plugin_sdk::testing::MockDaemon` — the
# same PluginHostService, the same session-token gate, the same permission gate
# the SDK's WireHarness runs against — and `astra_plugin_sdk::proto` for the
# `PluginCapabilityService` client. Writing a second mock daemon here is how the
# CLI's idea of the protocol and the SDK's would drift, which is the class of
# bug `spec/hooks.yaml` exists to end.
#
# `default-features = false` drops `schemars`: the CLI reads JSON Schema, it
# never derives one.
astra-plugin-sdk = { version = "0.7.1", path = "../astra-plugin-sdk", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Manifest rewriting during `build` is a surgical edit of one key, not a
# reserialize: a plugin.toml round-tripped through `toml::Value` loses the
# author's comments, ordering and formatting.
toml_edit = "0.22"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
tokio = { version = "1", features = ["full"] }
# `dev` drives a running daemon over gRPC (PluginService + ClientAuthService).
# Hand-rolled messages in src/daemon.rs — see the module docs for why there is
# no .proto and no codegen in this crate.
tonic = "0.12"
prost = "0.13"
# The `SttProcess` request stream `astra-plugin test` feeds a plugin.
tokio-stream = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
# Version-locked to the daemon (Astra/astra-rs/Cargo.toml): both sides must
# resolve `<config>` to the same directory or `--daemon-addr` autodetection
# reads a file nobody writes.
directories = "6"
# Executable lookup. NOT `Command::new(x).arg("--version").status().is_ok()`,
# which is what this CLI used to do and which is wrong twice: it reports success
# for a program that spawned and then exited non-zero, and on Windows it misses
# every `.cmd`/`.bat` shim — which is how `bun`, `npm` and `npx` are installed
# there — because CreateProcess does not consult PATHEXT the way a shell does.
which = "8"
# `RUST_LOG` has been documented since 0.1 (docs/en/cli.md) and was inert: no
# subscriber was ever installed, so every `tracing` event this CLI and its
# dependencies emit went nowhere.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
