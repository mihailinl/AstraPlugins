# The panel's submission page — the one address of the plugins service this CLI
# may carry, mirrored from astra-registry's copy of the contract's token file.
#
# It is a PAGE, not an endpoint. `astra-plugin publish` prints it, and opens it
# in the author's own browser, for a repository whose owner file carries a
# binding line. The page only fills in its form on a GET; the submission is a
# POST the author makes in the panel, signed in to their own Minice account
# (contract FLOW-77). Nothing in this CLI fetches it, posts to it or holds a
# credential for it, and C26 is the check that says so: `minice.ai` may appear
# in the CLI's sources in this file and nowhere else.
#
# PINNED AT
#   astra-registry@564f2a5860b83afb6ec92f3d71c38d03ec24d224
#
#   The commit this copy was taken from: `schema/contract-tokens-v1.json` there,
#   entry `page:FLOW-77`, contract 1.2.0. A record of provenance, not a claim
#   that the registry has not moved since. `tools/check-registry-mirrors.py
#   --rules C28` asks both questions: the PINNED leg, that `url` and `query`
#   below are that entry's `url` and `query` members at that commit, and the
#   HEAD leg, that they are what the registry holds now. Member by member, never
#   a joined URL string — the client plan's T7 reads the same two members, so
#   the three readers compare the same thing.
#
# WHO ELSE CARRIES IT
#
#   astra-plugin-cli/src/panel.yaml — a byte copy, because `include_str!` outside
#   the package directory is what `cargo package` refuses. C28 and the CLI's
#   own tests fail until the two are identical.
#   docs/{en,de,es,ja,ru,uk,zh} — every literal of the page there must spell
#   `url` with exactly these query parameters, in this order. C28 again.
#
# TO CHANGE IT
#
#   Change the contract, then astra-registry's token file; copy the entry's
#   `url` and `query` here, move the PINNED AT commit, copy this file to
#   astra-plugin-cli/src/panel.yaml, and run
#   `python3 tools/check-registry-mirrors.py --rules C28` and
#   `cargo test --manifest-path astra-plugin-cli/Cargo.toml`.
#
# FORMAT: `key: value`, `key:` then `  - item`, and `#` comments. Hand-parsed on
# both sides (no YAML dependency in the CLI or in the couplings job).

# mirrors: astra-registry/schema/contract-tokens-v1.json page:FLOW-77 url
url: https://astra.minice.ai/plugins/_/submit

# mirrors: astra-registry/schema/contract-tokens-v1.json page:FLOW-77 query
query:
  - repo
  - tag
