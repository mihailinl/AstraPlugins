    streaming: server
    daemon_calls: "src/plugins/capability_bridge.rs:157"
    summary: "Stream a model completion; the only way a plugin can be an AI provider."
    note: "Python and TypeScript bind it as an async generator; Rust as a channel-fed server stream that waits for the first chunk before opening the response, so an un-overridden hook can still answer UNIMPLEMENTED. All three SDKs bind it as of 5.4, so `ai_provider` is implementable in every language."
    rust: stable
    python: stable
    typescript: stable

  - rpc: AiGetModels
