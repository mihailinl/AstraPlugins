# Cross-language hook parity — the one place a plugin hook is declared.
#
# The three SDKs drift, and nothing used to notice. Phase 0 found `CallFromUi`
# missing in Python and unroutable in TS, three TS handlers silently dropped,
# and hooks that exist in Rust and nowhere else. Every one of those was found by
# a plugin author whose plugin did not work.
#
# This file is the answer: one row per hook, per-language status, and a checker
# that fails CI the moment a row and the source disagree.
#
# WHAT COUNTS AS A HOOK
#   The two plugin-facing services only:
#     PluginCapabilityService  daemon -> plugin  (the plugin serves, daemon calls)
#     PluginHostService        plugin -> daemon  (the daemon serves, plugin calls)
#   `PluginService` is deliberately absent: the daemon serves it to the Astra UI
#   and no plugin ever touches it, so an SDK has nothing to implement there.
#
# HOW TO CHANGE A HOOK
#   1. Edit or add the row here.
#   2. Run `python3 tools/parity/gen.py` (from the AstraPlugins repo root). It
#      rewrites `docs/en/parity.md`, `docs/en/hooks/{rust,python,typescript}.md`
#      and `spec/generated/conformance.json`.
#   3. Run `python3 tools/parity/check.py`. It reads the three SDKs' sources and
#      the proto, and fails on:
#        R1  a hook is `stable` here but has no binding in that SDK's source
#        R2  a binding exists in an SDK for an rpc with no row here
#        R3  an rpc exists in `proto/plugin.proto` but in no row here
#        R4  a `planned` row is past its `grace_until`
#        R5  `daemon_calls` does not point at a live call site (needs an Astra
#            checkout; skipped with a printed reason when there is none)
#   Both run in CI. Step 2 without step 3 is how the spec becomes fiction.
#
# FORMAT — a deliberately tiny subset of YAML, so `tools/parity/spec.py` parses
# it with no dependency (same reasoning as `spec/limits.yaml`): top-level
# `key: scalar`, plus `hooks:` as a sequence of FLAT mappings. No nesting inside
# a row, no multi-line scalars, no anchors. A `#` inside a value must be quoted.
# `tools/parity/spec.py` cross-checks itself against PyYAML when PyYAML happens
# to be importable, so the file stays real YAML.
#
# ROW FIELDS
#   rpc           the method name, exactly as `proto/plugin.proto` spells it
#   service       PluginCapabilityService | PluginHostService
#   direction     "daemon->plugin" | "plugin->daemon"
#   capability    the `[capabilities]` key in plugin.toml that owns this hook,
#                 or `core` for hooks every plugin has regardless of capability.
#                 Vocabulary from `astra-daemon/src/plugins/manifest.rs:110-141`.
#   requirement   required — the capability does not work without this hook.
#                 optional — the daemon carries on when the hook is absent.
#   routing       live      — the daemon really calls it; `daemon_calls` proves it
#                 unrouted  — declared in the proto, no daemon call site exists
#                 deprecated— has a call site history but is being retired
#   since         protocol version the hook first appeared in (the `// protocol:`
#                 header of `proto/plugin.proto`)
#   streaming     unary | server | client | bidi
#   daemon_calls  `file:line` under astra-rs/astra-daemon/ where the daemon
#                 invokes it (daemon->plugin) or serves it (plugin->daemon).
#                 The literal `none` is the honest answer for an unrouted hook.
#   summary       one line, what the hook is for
#   note          optional, one line, something a reader would otherwise get wrong
#   rust/python/typescript   stable | planned | n/a
#     stable   the SDK has a real binding today. R1 verifies it.
#     planned  committed, not shipped. Needs `<lang>_issue` and
#              `<lang>_grace_until` (ISO date). R4 fails once the date passes.
#     n/a      not implemented and not committed. Needs `<lang>_reason`.
#              A registered handler that answers UNIMPLEMENTED is `n/a`, not
#              `stable`: protocol-wise `Unimplemented` means "hook absent".

protocol: 1
proto: "proto/plugin.proto"
astra_daemon_root: "astra-rs/astra-daemon"
capabilities: "tools tts stt ai_provider client actions triggers ui_contributions event_handlers dom_access core"

# `dom_access` owns no rpc — it is a flag the daemon copies onto a plugin's UI
# contributions (`manager.rs:968`), not a hook. It is in the vocabulary above so
# the checker can tell an unknown capability from a hookless one.

hooks:
  # ── PluginCapabilityService — tools ──
  - rpc: ListTools
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: tools
    requirement: required
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:811"
    summary: "The tool schemas this plugin offers the model, read once at startup."
    rust: stable
    python: stable
    typescript: stable

  - rpc: CallTool
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: tools
    requirement: required
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:2300"
    summary: "Run one tool call on behalf of the model and return its result."
    rust: stable
    python: stable
    typescript: stable

  # ── PluginCapabilityService — tts ──
  - rpc: TtsSynthesize
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: tts
    requirement: required
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:2590"
    summary: "Synthesize one utterance and return the whole buffer."
    rust: stable
    python: stable
    typescript: stable

  - rpc: TtsSynthesizeStream
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: tts
    requirement: optional
    routing: unrouted
    since: 1
    streaming: server
    daemon_calls: none
    summary: "Synthesize one utterance as a chunk stream, for first-audio latency."
    note: "FINDING: no daemon call site exists in astra-rs. The Rust binding is dead code today."
    rust: stable
    python: "n/a"
    python_reason: "Nothing calls it; implementing it would be dead code until the daemon routes it."
    typescript: "n/a"
    typescript_reason: "plugin.ts registers an entry that answers UNIMPLEMENTED, which is protocol-identical to absent."

  - rpc: TtsListVoices
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: tts
    requirement: required
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:2638"
    summary: "The voices this provider exposes in the Voice settings picker."
    rust: stable
    python: stable
    typescript: stable

  - rpc: TtsGetConfigFields
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: tts
    requirement: optional
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:2878"
    summary: "Extra TTS settings fields, rendered by DynamicField on the Voice page."
    note: "Routed through the daemon's `optional_hook` helper (manager.rs:2878), so UNIMPLEMENTED means absent and a real fault is still a fault."
    rust: stable
    python: stable
    typescript: stable

  - rpc: TtsActivate
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: tts
    requirement: optional
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:2670"
    summary: "Deliver a licensed-voice content key for one-time machine-bound sealing."
    note: "The proto says UNIMPLEMENTED is treated as 'no activation needed'; the daemon does NOT route it through `optional_hook` — manager.rs:2664 propagates the error and vox_activation.rs:319 fails the activation. The proto comment is the one that is wrong."
    rust: planned
    rust_issue: "PRODUCTION_PLAN.md#5.4"
    rust_grace_until: 2026-12-31
    python: planned
    python_issue: "PRODUCTION_PLAN.md#5.8"
    python_grace_until: 2026-12-31
    typescript: planned
    typescript_issue: "PRODUCTION_PLAN.md#5.8"
    typescript_grace_until: 2026-12-31

