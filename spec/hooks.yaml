    summary: "List the models this provider can run."
    note: "FINDING: implemented in all three SDKs and called by nobody. `all_ai_providers` hardcodes supports_model_discovery=false, so the picker never asks. Marked deprecated in the proto; keep the bindings, grow no more."
    rust: stable
    python: stable
    typescript: stable

