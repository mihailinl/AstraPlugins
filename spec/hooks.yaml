    requirement: required
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:3565"
    summary: "Liveness probe, every 15 s."
    note: "Required in the strongest sense: this hook is NOT routed through `optional_hook`, so any error — UNIMPLEMENTED included — marks the plugin dead (manager.rs:1464)."
    rust: stable
    python: stable
    typescript: stable

