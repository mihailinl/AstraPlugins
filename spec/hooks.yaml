    requirement: optional
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:6743"
    summary: "Drop the recognizer model so idle-unload actually frees VRAM."
    rust: stable
    python: stable
    typescript: stable

  - rpc: SttGetLoadState
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: stt
    requirement: optional
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:6694"
    summary: "Report Loaded / NotLoaded / NotNeeded so the daemon can drive idle-unload."
    note: "manager.rs:2960 maps an absent hook to NotNeeded, which is the pre-hook behaviour."
    rust: stable
    python: stable
    typescript: stable

  # ── PluginCapabilityService — ai_provider ──
  - rpc: AiComplete
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: ai_provider
    requirement: required
    routing: live
