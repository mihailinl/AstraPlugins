    summary: "Load the recognizer model, with the daemon-resolved path and GPU toggle."
    note: "manager.rs:2918 routes it through `optional_hook`, which is why this is optional."
    rust: stable
    python: stable
    typescript: stable

  - rpc: SttUnload
    service: PluginCapabilityService
    direction: "daemon->plugin"
