    summary: "Which of this plugin's trigger types a command is currently listening for."
    note: "manager.rs:2523 routes it through `optional_hook`."
    rust: stable
    python: stable
    typescript: stable

  # ── PluginCapabilityService — ui_contributions ──
  - rpc: GetUiContributions
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: ui_contributions
    requirement: required
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:3016"
    summary: "The pages, slots, overlays and effects this plugin renders in the Astra window."
    rust: stable
    python: stable
    typescript: stable

  - rpc: CallFromUi
    service: PluginCapabilityService
    direction: "daemon->plugin"
    capability: ui_contributions
    requirement: optional
    routing: live
    since: 1
    streaming: unary
    daemon_calls: "src/plugins/manager.rs:3197"
    summary: "A method call from this plugin's own iframe into its backend."
