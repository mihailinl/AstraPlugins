    summary: "Audio chunks in, transcript events out; carries both one-shot and streaming STT."
    note: "Also driven live at manager.rs:2808. Channel capacity on both ends is spec/limits.yaml:stt_audio_channel_capacity."
    rust: stable
    python: stable
    typescript: stable

  - rpc: SttGetLanguages
