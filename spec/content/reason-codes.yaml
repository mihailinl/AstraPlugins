# The content catalogue's refusal vocabulary — every code a content ingest,
# a content publisher check or the client can answer with, and its state.
#
# This file is the CONTRACT side. The server's table
# (minice plugins/crates/plugins-api/src/guest/reason_codes/content.rs, lane L2)
# and the client's refusal enum (Astra, lane L8) carry these exact spellings;
# a door refusal is HTTP 422 with the token, never 401 or 403 (crowdsec counts
# those; design §3.1).
#
# content.rs is GENERATED, not hand-maintained: minice's
# `plugins/scripts/gen_content_reason_codes.py` reads a vendored copy of this
# file (`plugins/crates/plugins-ingest/tests/fixtures/content/reason-codes.yaml`)
# and writes `plugins/crates/plugins-api/src/guest/reason_codes/content.rs`.
# Renaming or removing a code here is a coordinated change with that
# generator and its vendored copy, not a local edit.
#
# `tools/check-content-goldens.py` holds the three directions that can drift:
#   * every `E_*` / `F_*` token any spec/content/*.md cites is listed here;
#   * every `ingest:` and `flags:` name here is specified in a spec/content/*.md;
#   * every code testdata/content/vectors.json expects is listed here;
#   * every `client:` token is specified, in backticks, in a spec/content/*.md.
#
# States, as spec/submission-tokens.yaml uses them:
#   live        — emitted; a consumer must handle it
#   reserved    — named so nobody coins a second spelling; not emitted in v1
#
# FORMAT: `section:`, then indented `NAME: state` lines, and `#` comments.
# Hand-parsed; the content-spec job installs nothing.

# refusals of an upload (ingest-v1.md). The first failing step's code is the answer.
ingest:
  # the begin door, before any other check: no CSAM scanner configured (ingest-v1.md §1, design §8a)
  E_CONTENT_PUBLISHING_CLOSED: live
  # the begin door, after the permission: the request's region is not open to publishing (ingest-v1.md §1, design §7a)
  E_PUBLISH_REGION_CLOSED: live
  # the begin door, after the sanction check: no public name (minice:handle / minice:display_name) set in minice-id yet (ingest-v1.md §1, architect minice-b9 2026-11-03)
  E_CONTENT_HANDLE_REQUIRED: live
  E_ZIP_END_RECORD: live
  E_ARCHIVE_TOO_MANY_ENTRIES: live
  E_ARCHIVE_ENCRYPTED: live
  E_ARCHIVE_METHOD: live
  E_ARCHIVE_LINK: live
  E_ZIP_HEADERS_INCONSISTENT: live
  E_ARCHIVE_NAME_UNSAFE: live
  E_ARCHIVE_TOO_LARGE: live
  E_ARCHIVE_RATIO: live
  E_ARCHIVE_MUST_BE_STORED: live
  E_BUNDLE_MANIFEST: live
  E_BUNDLE_FILE_UNLISTED: live
  E_BUNDLE_FILE_DIGEST: live
  E_CONTENT_DIGEST_MISMATCH: live
  E_CONTENT_TOO_LARGE: live
  E_CONTENT_QUOTA: live
  E_CONTENT_BLOCKED: live
  E_CONTENT_FORMAT: live
  E_CONTENT_IMAGE_DIMENSIONS: live
  E_CONTENT_MEDIA_TYPE: live
  E_CONTENT_PARTS_MISMATCH: live
  E_CONTENT_FILE_OUTSIDE_PARTS: live
  E_CONTENT_LICENCE_CONFLICT: live
  E_CONTENT_LICENCE_REFUSED: live
  # an avatar-classified GLB/.gltf (0.x VRM or 1.0 VRMC_vrm) in ANY part that is not a character's
  # or model's own part -- animations, art, audio or command alike -- whatever its verdict; never
  # a file in NO part at all, which is E_CONTENT_FILE_OUTSIDE_PARTS (ingest-v1.md §3 step 11, §4.3)
  E_CONTENT_AVATAR_IN_PACK: live
  E_CONTENT_LICENCE_UNDECLARED: live
  # begin, before upload: a declared licence (common-v1.md §3.1) does not parse -- one bad entry refuses the whole begin
  E_CONTENT_LICENCE_DECLARATION_INVALID: live
  E_COMMAND_FORMAT: live
  E_COMMAND_UNKNOWN_ACTION: live
  E_COMMAND_UNKNOWN_TRIGGER: live
  E_COMMAND_PLUGIN_UNNAMED: live
  E_COMMAND_CAPS_MISMATCH: live
  E_COMMAND_REQUIRES_MISMATCH: live
  E_COMMAND_REQUIRES_UNLISTED: live
  E_PACK_NESTED: live
  E_PACK_TOO_MANY_MEMBERS: live
  E_PACK_MEMBER_KIND_UNSERVED: live
  E_PACK_MEMBER_UNLISTED: live
  E_PACK_MEMBER_DIGEST: live
  E_CHARACTER_REQUIRES_UNLISTED: live
  E_CHARACTER_REQUIRES_DIGEST: live
  E_SERVED_UNVERIFIED: live
  # the plugin vocabulary, reused unchanged for a content slug (design §2)
  E_ID_RESERVED_PREFIX: live

# not refusals: a flag holds the version for a moderator, or orders the queue
flags:
  F_CONTENT_VRM_META_UNKNOWN: live
  # a declared licence (no VRM meta) ALWAYS holds, an established author too (ingest-v1.md §4.3)
  F_CONTENT_LICENCE_DECLARED: live
  F_COMMAND_EXEC_AND_NETWORK: live
  # held: a CSAM scanner error or timeout, or an image that cannot be decoded (§8a)
  F_CONTENT_CSAM_UNSCANNED: live

# what a CLIENT says when it refuses an install, an update or a document
# (common-v1.md §7, trust-kind-keys-v1.md §7). Lower-case, as the client's
# existing catalogue refusals are.
client:
  kind-keys-unusable: live
  signature-invalid: live
  key-retired: live
  serial-rollback: live
  issued-in-future: live
  expired: live
  withdrawn-stale: live
  withdrawn-unverified: live
  artefact-digest-mismatch: live
  claim-mismatch: live
  requires-digest-mismatch: live
  requires-unavailable: live
  member-digest-mismatch: live
  member-unavailable: live
  need-unknown: live
  command-unknown-trigger: live
  # publisher-side invariant the checker names (common-v1.md §6.4)
  cascade-missing: live
  # publisher-side invariant: a listed pack or character pins a version its kind's index does not
  # list (common-v1.md §3.5)
  pin-unlisted: live
