[project]
name = "astra-plugin-sdk"
version = "0.5.0"
description = "Python SDK for building Astra plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
# The level-1/level-2 harnesses in `astra_plugin_sdk.testing` need nothing the
# SDK does not already have — pytest is here so `pip install astra-plugin-sdk[test]`
# gets a plugin author a working test run in one command, not because the
# harness imports it. `astra_plugin_sdk.testing.Harness` works from plain
# `python -m unittest` or a bare script.
test = ["pytest>=7.0"]

# The fixtures in `astra_plugin_sdk.testing.fixtures` register themselves with
# pytest through this entry point, so a plugin's tests can use `harness` and
# `golden_pcm` with no conftest.py at all.
[project.entry-points.pytest11]
astra_plugin_sdk = "astra_plugin_sdk.testing.fixtures"

[project.urls]
Homepage = "https://github.com/mihailinl/AstraPlugins"
Repository = "https://github.com/mihailinl/AstraPlugins/tree/master/astra-plugin-sdk-python"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astra_plugin_sdk*"]

# The vendored protocol file. setuptools packages data from inside the package
# directory only, which is the entire reason `astra_plugin_sdk/proto/plugin.proto`
# exists as a copy of the repo-root `proto/plugin.proto` — without this stanza the
# copy would never reach an sdist or wheel and the justification for it would be
# hollow. `tools/sync-proto.sh` writes it; `tools/check-proto.sh` verifies it.
#
# `py.typed` is the PEP 561 marker (§5.8): without it a type checker in a
# plugin's own repo ignores every annotation this package ships, so the
# dataclasses, the `ToolError` hierarchy and the hook signatures are invisible
# exactly where they are meant to help. It has to be listed here for the same
# reason the proto does — setuptools does not ship non-Python files by default.
[tool.setuptools.package-data]
astra_plugin_sdk = ["proto/*.proto", "py.typed"]
