<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Text Utils">
  <title>Text Utils</title>
  <!-- Monoline: a page of text with one line picked out, and the clock that
       fires on a schedule. Plain static markup: no script, no external
       references, no embedded fonts. -->

  <g fill="none" stroke="#94a3b8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 28 h96 l50 50 v136 H40 Z"/>
    <path d="M136 28 v50 h50"/>
  </g>

  <g stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M70 112 h84" stroke="#94a3b8"/>
    <path d="M70 146 h54" stroke="#f59e0b"/>
    <path d="M70 180 h70" stroke="#94a3b8"/>
  </g>

  <!-- the scheduled trigger, punched clear of the page -->
  <circle cx="188" cy="192" r="50" fill="#ffffff"/>
  <circle cx="188" cy="192" r="40" fill="none" stroke="#f59e0b" stroke-width="13"/>
  <path d="M188 170 v24 h19" fill="none" stroke="#f59e0b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
