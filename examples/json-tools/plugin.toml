[plugin]
id = "json-tools"
name = "JSON Tools"
version = "0.1.2"
description = "Format, query, and diff JSON — with actions and triggers"
author = "Mihailin"
license = "MIT"

[entry]
command = "node"
args = ["dist/index.js"]
runtimes = ["node"]

[capabilities]
tools = true
actions = true
triggers = true

# `[permissions]` is the other direction: which host RPCs the plugin may call
# out to. Default-deny — a manifest with no `[permissions]` section may call
# nothing beyond Register, PluginLog and GetPluginSelfConfig, so declaring
# `actions = true` is not what lets `set_variable` through. This is.
[permissions]
set_variable = { reason = "Publishes the transformed JSON as the variable your command names in 'Store Result In'", scopes = ["session"] }

[config]
schema = """
{
  "type": "object",
  "properties": {
    "default_indent": {
      "type": "number",
      "default": 2,
      "title": "Default Indent"
    }
  }
}
"""
