[plugin]
id = "doom"
name = "Doom"
version = "0.1.2"
description = "Play DOOM (1993 shareware) inside Astra via js-dos"
author = "Mihailin"
license = "MIT"

[entry]
command = "target/release/doom"

[capabilities]
ui_contributions = true
dom_access = true

[permissions]
dom_access = { reason = "Runs the js-dos emulator inside the Astra window, which is what playing DOOM in a panel requires" }

[config]
schema = """
{
  "type": "object",
  "properties": {
    "scale_mode": {
      "type": "string",
      "default": "fit",
      "title": "Scale Mode",
      "enum": ["fit", "stretch", "pixel-perfect"]
    }
  }
}
"""
