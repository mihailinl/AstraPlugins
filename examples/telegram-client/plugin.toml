[plugin]
id = "telegram-client"
name = "Telegram Bot"
version = "0.2.0"
description = "Talk to Astra from Telegram — your message in, the reply streamed back as it is written"
author = "Mihailin"
license = "MIT"

[entry]
command = "target/release/telegram_client"

[capabilities]
# `spec/hooks.yaml` files `SendChatMessage` under `client`. The capability is
# what this plugin IS; the permission below is what lets it call.
client = true

[permissions]
client = { reason = "Acts as a chat front-end: what you write in Telegram is sent to Astra as if you had typed it" }
send_chat_message = { reason = "Sends your Telegram messages to Astra and streams the reply back into the chat" }

[config]
schema = """
{
  "type": "object",
  "properties": {
    "bot_token": {
      "type": "string",
      "title": "$config.bot_token.title",
      "description": "$config.bot_token.description"
    },
    "allowed_usernames": {
      "type": "string",
      "title": "$config.allowed_usernames.title",
      "description": "$config.allowed_usernames.description"
    },
    "allow_screenshot": {
      "type": "boolean",
      "default": false,
      "title": "$config.allow_screenshot.title",
      "description": "$config.allow_screenshot.description"
    }
  },
  "required": ["bot_token"]
}
"""
