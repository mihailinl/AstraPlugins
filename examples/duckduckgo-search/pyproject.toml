[project]
name = "duckduckgo_search_example"
version = "0.1.0"
description = "Example web search provider for Astra: DuckDuckGo's HTML results page, scraped. Not for the catalogue"
requires-python = ">=3.10"
# Standard library only, beyond the SDK: urllib for the request, html.parser
# for the page.
dependencies = [
    "astra-plugin-sdk",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
