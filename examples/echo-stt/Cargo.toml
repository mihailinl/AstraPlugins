[package]
name = "echo_stt"
version = "0.1.0"
edition = "2024"

[dependencies]
astra-plugin-sdk = { path = "../../astra-plugin-sdk" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
# Match the daemon's rodio version — 0.19 with full default features
# (we need the resampler, not just the wav decoder).
rodio = "0.19"
once_cell = "1"
crossbeam-channel = "0.5"
