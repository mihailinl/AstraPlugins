[plugin]
id = "companion-cat"
name = "Companion Cat"
version = "0.1.7"
description = "A cat that flies around the UI and says random things"
author = "Mihailin"
license = "MIT"

[entry]
command = "target/release/companion"

[capabilities]
ui_contributions = true
dom_access = true

[permissions]
dom_access = { reason = "Flies the cat around the Astra interface, which means running its own JavaScript inside the Astra window" }
