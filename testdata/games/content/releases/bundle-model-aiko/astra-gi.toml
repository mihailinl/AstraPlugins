# content check golden: the content catalogue's valid model-aiko.astrachar, byte for byte, with NO
# licence declared -- accepted: its body's readable VRM licence is the part's licence (licence_source vrm).
schema = 1

[integration]
id = "someone.bundle-model-aiko"
name = "Bundle Model Aiko"
version = "0.1.0"
license = "MIT"

[[integration.content]]
path = "characters/aiko.astrachar"
kind = "character"
title = "aiko"
credit = "someone"

[target]
exe = "*"
platforms = ["windows-x64"]
anti_cheat = "none"
