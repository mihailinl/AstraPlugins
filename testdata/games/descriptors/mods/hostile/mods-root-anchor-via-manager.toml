# Hostile `mods` golden: a ROOT-ANCHORED loader routed THROUGH A MANAGER
# (engine-descriptor-v1.md §7.4). Sending the start through a mod manager
# changes what Astra does, so `via-manager` is not passive, and a loader
# that does it needs a file anchor. Schema-valid; the checker's root-anchor
# rule refuses it: mods-invalid, reason root-anchor-not-passive.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [ { child = "{source}/s2loader/mods", kind = "dir" } ]
root = "{source}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "via-manager" } ]
