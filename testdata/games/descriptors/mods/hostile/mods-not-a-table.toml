# Hostile `mods` golden: `mods` that is NOT A TABLE (engine-descriptor-v1.md
# §7.1). `[[mods]]` is an array of tables -- the one shape launcher 0.5.0
# checks and refuses (descriptor-invalid, field `mods`), and so the one
# error in `mods` that skips the WHOLE descriptor, in every version, rather
# than only `mods`: a reader cannot tell what such a member was meant to be.
# The schema refuses it (type), and so does the 0.5.0 reader's view.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods]]
id = "s2-loader"
name = "S2 Loader"
