# Hostile `mods` golden: a CHAIN ENTRY named after the game's own program
# (engine-descriptor-v1.md §7.6, §7.4's program rule). `{stem}.dll` is
# recognised and is a `.dll`, but it is the game's own library by name, not
# the loader's. Schema-valid; the checker's entry rule refuses it:
# mods-invalid, reason chain-entry-invalid.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [
  { stat = "{source}/s2loader/s2loader.dll", kind = "file" },
  { stat = "{source}/{stem}.dll", kind = "file" },
]
root = "{source}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "chain", entry = "{source}/{stem}.dll" } ]
