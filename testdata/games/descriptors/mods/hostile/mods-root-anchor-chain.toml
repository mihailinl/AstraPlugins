# Hostile `mods` golden: a ROOT-ANCHORED loader that CHAINS
# (engine-descriptor-v1.md §7.4, §7.6). It is anchored on its own mods root
# and hands control to winhttp.dll. It breaks two rules, and must: any entry
# that passed §7.6 would be a file anchor itself, so a root-anchored loader
# can only chain into a file §7.6 refuses. Schema-valid; the checker refuses
# it twice: mods-invalid, reasons root-anchor-not-passive and
# chain-entry-invalid.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [
  { child = "{source}/s2loader/mods", kind = "dir" },
  { stat = "{source}/winhttp.dll", kind = "file" },
]
root = "{source}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "chain", entry = "{source}/winhttp.dll" } ]
