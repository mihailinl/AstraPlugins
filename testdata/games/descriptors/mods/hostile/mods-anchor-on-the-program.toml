# Hostile `mods` golden: a loader ANCHORED ON THE GAME'S OWN PROGRAM
# (engine-descriptor-v1.md §7.4; §2.4's "must not itself be a program
# file"). `{stem}.exe` is in every folder this descriptor placed, and
# winhttp.dll beside it is any proxy at all, so the loader would be
# "recognised" in every game. Schema-valid; the checker's anchor rule
# refuses it: mods-invalid, reason loader-anchor-invalid.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [
  { stat = "{source}/{stem}.exe", kind = "file" },
  { stat = "{source}/winhttp.dll", kind = "file" },
]
root = "{source}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "side-by-side" } ]
