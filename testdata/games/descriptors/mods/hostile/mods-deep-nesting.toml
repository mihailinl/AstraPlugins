# Hostile `mods` golden: UNBOUNDED NESTING (engine-descriptor-v1.md §7.1, §7.8).
# `any` inside `any`, 39 deep -- one under the toml crate's fixed
# recursion limit of 80 nested tables and arrays, so a TOML reader still
# parses the document and only the budget rule refuses `mods`. A reader that recursed on it -- a JSON Schema
# validator, a parser with a recursion limit such as serde_json's 128 --
# could fail the WHOLE document carrying it, breaking "an error inside
# `mods` drops only `mods`". The schema's `require` levels stop at depth 3,
# so nothing recurses further; the checker's budget rule counts the depth:
# mods-invalid, reason over-budget.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [
  { stat = "{source}/s2loader/s2loader.dll", kind = "file" },
  { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { any = [ { stat = "{source}/s2loader/x.dll", kind = "file" } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] } ] },
]
root = "{source}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "side-by-side" } ]
