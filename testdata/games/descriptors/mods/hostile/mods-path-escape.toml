# Hostile `mods` golden: a PATH ESCAPE (engine-descriptor-v1.md §7.3).
# The mods root climbs out of `{source}` with `..`, hoping the launcher lists
# (or, worse, one day writes) a folder outside the player's mod set. A §7.3
# component is never `..`, so the schema refuses it: mods-invalid, reason
# path-escapes.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [ { stat = "{source}/s2loader/s2loader.dll", kind = "file" } ]
root = "{source}/../../../Users/Public/Documents"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "side-by-side" } ]
