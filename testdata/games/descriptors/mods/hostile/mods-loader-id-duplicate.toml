# Hostile `mods` golden: two loaders with ONE ID (engine-descriptor-v1.md
# §7.2). The launcher remembers the player's choice and names a loader to
# them by its id; two loaders sharing one would let the second answer for the
# first. Schema-valid; the checker refuses it: mods-invalid, reason
# loader-id-duplicate.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [ { stat = "{source}/s2loader/s2loader.dll", kind = "file" } ]
root = "{source}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "side-by-side" } ]

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader (portable)"
codes = ["source2"]
source = ["game"]
require = [ { stat = "{source}/s2loader-portable/s2loader.dll", kind = "file" } ]
root = "{source}/s2loader-portable/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "side-by-side" } ]
