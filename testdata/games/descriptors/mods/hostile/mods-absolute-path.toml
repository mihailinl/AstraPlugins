# Hostile `mods` golden: an ABSOLUTE PATH (engine-descriptor-v1.md §7.3).
# The loader is "recognised" by a system file named by its absolute path, so
# that recognition would probe the player's machine rather than their mod
# set. Every §7.3 path begins with `{source}`; a drive letter, a leading `/` or
# a UNC path cannot, so the schema refuses it: mods-invalid, reason
# path-outside-jail.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [ { stat = "C:/Windows/System32/drivers/etc/hosts", kind = "file" } ]
root = "{source}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "side-by-side" } ]
