# Hostile `mods` golden: an UNKNOWN PLACEHOLDER (engine-descriptor-v1.md §7.3).
# `{home}` is no §2.4 name and no capture of this descriptor's rules; a
# reader that expanded it would be reading wherever "home" pointed. The
# schema sees only the syntax of a placeholder; the checker's placeholder
# rule refuses it: mods-invalid, reason placeholder-unknown.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [ { stat = "{source}/s2loader/s2loader.dll", kind = "file" } ]
root = "{source}/{home}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "side-by-side" } ]
