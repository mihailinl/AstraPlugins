# Hostile `mods` golden: a loader ANCHORED ON THE ENGINE'S OWN FILE
# (engine-descriptor-v1.md §7.4). engine2.dll is what this descriptor's
# detection looks up, so it is in every game this descriptor places: the
# loader would be "found" everywhere. Schema-valid; the checker's anchor rule
# refuses it: mods-invalid, reason loader-anchor-invalid.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [
  { stat = "{source}/game/bin/win64/engine2.dll", kind = "file" },
]
root = "{source}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "side-by-side" } ]
