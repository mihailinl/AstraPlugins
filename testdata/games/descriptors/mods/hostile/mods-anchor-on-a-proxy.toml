# Hostile `mods` golden: a loader recognised by a PROXY DLL alone
# (engine-descriptor-v1.md §7.4, the loader anchor). winhttp.dll is the name
# BepInEx's Doorstop, MelonLoader-style and ASI loaders all hijack-load by, so
# "winhttp.dll is there" says some loader sits in the folder, never which.
# Recognised on that alone, the loader would be "found" beside any
# proxy at all.
# Schema-valid; the checker's anchor rule refuses it: mods-invalid, reason
# loader-anchor-invalid.
#
# Its detection half is compat/source2-with-mods.toml's (a valid descriptor), so a
# CLIENT keeps detecting with it and drops only `mods` (§7.9); ingest and
# lint refuse it.
schema = "astra.engine/1"
engine = { codes = { source2 = "Source 2" } }

[[rule]]
tier = "strong"
programs = { ext = ["exe"], at = "{project}/bin/win64", first = 8 }
require = [
  { listed = "engine2.dll", kind = "file" },
  { child = "{project}/core", kind = "dir", as = "core" },
]
code = "source2"
confidence = "high"
binary = "windows"
evidence = "{core}"

[[mods.loader]]
id = "s2-loader"
name = "S2 Loader"
codes = ["source2"]
source = ["game", "picked"]
require = [
  { stat = "{source}/winhttp.dll", kind = "file" },
  { any = [
      { stat = "{source}/s2loader/s2loader.dll", kind = "file" },
      { stat = "{source}/s2loader/s2loader64.dll", kind = "file" },
  ] },
]
root = "{source}/s2loader/mods"
enabled = [ { format = "dir-per-mod" } ]
coexist = [ { strategy = "side-by-side" } ]
