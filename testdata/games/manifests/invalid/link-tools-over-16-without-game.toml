# Invalid (semantic, tools-over-16-without-game): 17 tools and none of them danger = "game": a GI
# without actions in the game keeps the limit of 16 (manifest.md §2.6). The schema alone passes it.
schema = 1

[integration]
id = "someone.viking-helper"
name = "Astra helps in a viking game"
version = "0.3.0"
authors = ["someone"]
license = "MIT"
repo = "https://github.com/someone/viking-helper"

[integration.capabilities]
companion = ["presentation"]

[integration.link]
context = "astra/context.json"
shares_other_players = false

[[integration.link.tools]]
name = "look_00"
description = "Tool look_00"
params = "astra/tools/look_00.json"
result = "astra/tools/look_00.result.json"
danger = "low"

