# Invalid (semantic, knowledge-without-licence): a knowledge base whose licence is not declared, so
# the consent sheet could not say it (link-v1.md §5 "Knowledge"). The schema alone passes it.
schema = 1

[integration]
id = "someone.viking-helper"
name = "Astra helps in a viking game"
version = "0.3.0"
authors = ["someone"]
license = "MIT"
repo = "https://github.com/someone/viking-helper"

[integration.capabilities]
companion = ["presentation"]

[integration.link]
context = "astra/context.json"
shares_other_players = false
knowledge = "astra/knowledge"

[[integration.link.tools]]
name = "gather"
description = "Go and gather a resource the player named, into her own bag"
params = "astra/tools/gather.json"
result = "astra/tools/gather.result.json"
danger = "game"
companion = true

[[integration.link.tools]]
name = "guard"
description = "Fight off whatever attacks the player, until told to stop"
params = "astra/tools/guard.json"
result = "astra/tools/guard.result.json"
danger = "game"
companion = true

[[integration.link.tools]]
name = "stop_work"
description = "Stop gathering or guarding and come back"
params = "astra/tools/stop_work.json"
result = "astra/tools/stop_work.result.json"
danger = "low"
stops = true
companion = true

[[integration.link.tools]]
name = "bag_contents"
description = "What is in her bag"
params = "astra/tools/bag_contents.json"
result = "astra/tools/bag_contents.result.json"
danger = "low"

[target]
steam_appid = 892970
exe = "valheim.exe"
platforms = ["windows-x64", "linux-proton"]
anti_cheat = "none"

[[files]]
from = "BepInEx/plugins/**"
to = "${profile}/BepInEx/plugins/"
