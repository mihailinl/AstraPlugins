# C30 — what `tools/check-registry-mirrors.py --rules C30` searches for, what it
# lets through, and which promises it holds to their amendments.
#
# FOUR KINDS OF RECORD
#
#   kind: channel   a literal of the registry's issue channel. From the
#                   registry's cutover (R6) there is no such channel: listing,
#                   release pings, `/recheck`, reports and appeals are all the
#                   panel's. A channel literal found in a subject file, and not
#                   let through by an `exempt` record, is red. `from` is the step
#                   the literal starts binding; `armed: yes` is what makes it
#                   bind — flipped in the commit that makes the step's promise
#                   true, never by a date.
#   kind: scope     a set of files that joins the channel search at a later step
#                   than the rest (`armed: yes` until then).
#   kind: exempt    a reasoned exemption. `path` is an fnmatch glob, `literal`
#                   the channel literal (or `*`). `min` is how many hits it must
#                   let through: an exemption that matches fewer fails, as C24's
#                   do — a hole left open after the thing it excused has gone is
#                   the shape this rule exists to find. `expires: cli-minor>N`
#                   makes the exemption itself red once astra-plugin-cli's minor
#                   exceeds N.
#   kind: promise   a sentence ROLL-47 says must be amended in the change that
#                   first makes it false. `literal` is the sentence as it stood,
#                   in one file, in one language — matched with all whitespace
#                   removed, so a reflowed line is the same sentence. Unarmed,
#                   it must occur EXACTLY ONCE in the tree (the anchor is real
#                   and unique). Armed, it must occur exactly once at `prefix`,
#                   a commit from before the amendment (the literal was real),
#                   and nowhere in the tree now (the amendment happened).
#                   A `path` may be a glob; then every file it matches is held
#                   to the rule on its own, and it must match at least one.
#
# FORMAT — the same as check-registry-mirrors.exempt.yaml: records separated by
# blank lines, one `key: value` per line, an INDENTED line continuing the key
# above it, `#` whole-line comments.

# ── the issue channel ────────────────────────────────────────────────────────

kind: channel
id: registry-issues
literal: astra-registry/issues
from: R6
armed: yes
why: Every door into the registry's issue tracker.

kind: channel
id: issues-new
literal: issues/new
from: R6
armed: yes
why: A prefilled issue form, in any repository — the shape `publish` used to open.

kind: channel
id: recheck
literal: /recheck
from: R6
armed: yes
why: The issue command that re-ran a submission. The panel's Recheck replaces it.

kind: channel
id: release-ping
literal: release-ping
from: R6
armed: yes
why: The release-ping form `publish --notify` opened. Detection is automatic.

kind: channel
id: listing-template
literal: plugin-listing.yml
from: R6
armed: yes
why: The listing form `publish` opened. The panel's submission page replaces it.

kind: channel
id: notify-flag
literal: --notify
from: R6
armed: yes
why: The manual ping. FLOW-47 kept it one minor release (0.5.0) as a stub that
  opened the panel; release C (0.6.0) removed it, and with it the exemption.

kind: scope
id: proto-copies
path: *plugin.proto
from: R5
armed: no
why: The three exported proto copies describe the daemon's report link, which IS
  the issue channel for every client before the R5 release. They join the
  channel scope at R5, when AP-13 re-exports Astra's rewritten report copy. The
  plan put them in scope at R6 with no exemption because R5 came first; contract
  2.2.0 lets R6 come first, and a check that is red on a sentence still true of
  every shipped client is a check somebody exempts by hand.

kind: channel
id: retired-anchor-ownership
literal: #2--prove-you-control-the-repository
armed: yes
why: The heading "Prove you control the repository" in docs/en/5-publish/get-listed.md
  is gone with the login proof; its binding replacement is #bind-your-repository.
  linkcheck catches a relative link to it; this catches an absolute one.

kind: channel
id: retired-anchor-hold
literal: #how-a-hold-is-cleared
armed: yes
why: Holds are cleared by a moderator in the panel; the section that described
  `/approve` on an issue is gone.

kind: channel
id: retired-anchor-after-submit
literal: #4--what-happens-after-you-submit
armed: yes
why: Renumbered to #3--what-happens-after-you-submit when the login step went.

