name: CI

# ─────────────────────────────────────────────────────────────────────────────
# THE single CI workflow for AstraPlugins. One file, one owner.
#
# Everything Phase 1 built lands here: this is the file that keeps it true.
# Three SDKs, one CLI, eleven examples and one protocol drifted apart for months
# because nothing compared them. Every job below exists because a specific bug
# shipped, and each one names it. When you add a job, name the bug.
#
# ── WHAT EACH PHASE 0 BLOCKER IS CAUGHT BY ─────────────────────────────────
#
#   dde9de7 HostClient never attached `x-session-token`  -> couplings (C7) +
#           (daemon-side, the real oracle) Astra's `cargo test -p astra-daemon`
#           integration canary from task 0.2, which lives in the other repo.
#   dde9de7 on_shutdown() never ran; serve failure exited 0; the capability
#           server served anyone                               -> sdk-rust tests
#           (runner::tests::capability_server_*, which drive a real server over
#           the wire), and the same three cases in Python and TypeScript
#   4822352 Python HostClient sent no token; CallFromUi missing -> couplings (C7),
#           parity (R1: `stable` in the spec, no binding in the SDK)
#   4822352 Python stdout block-buffered, so the supervisor reaped the plugin
#                                                          -> couplings (C8)
#   6bb5395 two hand-maintained proto STRINGS inline in the TS SDK, and a third
#           stale plugin.proto file                        -> proto-vendored
#           (check-proto.sh rule 4 for the file, couplings C9 for the strings)
#   6bb5395 grpc-js silently dropped handlers absent from the descriptor
#                                                          -> sdk-ts (contract.test.mjs)
#   51e6fc7 `astra-plugin new` scaffolded a project that did not build
#                                                          -> scaffold-roundtrip
#   51e6fc7 the CLI's forked capability vocabulary drifted from the daemon's
#                                                          -> couplings (C5) for the
#           in-repo half, proto-upstream (full mode) for equality WITH the daemon
#   51e6fc7 the scaffold shipped `@astra/plugin-sdk`, a scope that does not exist
#                                                          -> scaffold-roundtrip (S5)
#           + couplings (C6 ratchet)
#   c811ca9 nine examples pinned `target/release/<name>.exe`, unrunnable on Linux
#                                                          -> examples-rust (E2)
#   c811ca9 three vendored proto copies + a committed .zip build artifact
#                                                          -> proto-vendored (the
#           absent-list) + couplings (C11)
#   1.2     the 12 proto mismatches between SDK and daemon  -> proto-upstream
#   1.6     the 500-vs-32 STT channel capacity              -> couplings (C1) for
#           the spec-vs-SDK half, proto-upstream full mode ("C1 (full)") for the
#           spec-vs-DAEMON half. Both halves are needed: C1 runs without an Astra
#           checkout, so the generator skips the daemon block; and the daemon's
#           own `assert!` compares its constants against the generated mirror
#           beside them, which a regeneration moves in lockstep. Neither one
#           alone can see a spec edit that never reached the daemon.
#   1.7     hooks one SDK has and another does not          -> parity
#
# ── WHAT THIS WORKFLOW CANNOT CATCH ────────────────────────────────────────
#
# Nothing here runs a daemon. A plugin that registers, is spawned and answers a
# real RPC is proved by Astra's own integration test (task 0.2) and, from
# Phase 5, by `astra-plugin test` — see the `conformance` job in
# release-sdks.yml, which fails the moment that command exists and is not wired.
# Do not let anything below grow into a pretend end-to-end test.
#
# Three Phase 0 blockers have NO job here, and saying which is the point:
#
#   4822352 the Python DaemonClient was gated on the token alone, and since
#           SECURITY(B1) the daemon issues a token to EVERY plugin — so the
#           check was trivially true and a trigger-only plugin opened a client
#           it has no permission to use. A condition that is present and wrong
#           is invisible to every gate in this file. Only a daemon-side test of
#           what a non-client plugin may reach catches it.
#   51e6fc7 `astra-plugin dev` never passed --auth-token, so the documented dev
#           loop could not work at all. It now drives a running daemon, which is
#           exactly what CI does not have.
#   51e6fc7 `keygen` wrote key material with whatever the umask allowed. File
#           modes on a key nothing here generates.
#
# Do not close these by inventing a grep. Close them where the behaviour is:
# a daemon-side test, and Phase 5's harness.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
  workflow_dispatch:
  # release-sdks.yml gates the publish on this whole matrix by calling it, so
  # the release cannot run a weaker CI than a PR does.
  workflow_call:
    secrets:
      ASTRA_REPO_TOKEN:
        description: >-
          Read-only token for the private Astra repo. Absent on forks and on
          pull requests from them; `proto-upstream` then runs in degraded mode
          and says so instead of reporting a check it did not perform.
        required: false

permissions:
  contents: read

concurrency:
  # Safe to cancel: this workflow publishes nothing. release-sdks.yml deliberately
  # does not do this.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Every SDK build compiles the proto with tonic-build.
  PROTOC_VERSION: "27.x"

jobs:
  # A YAML parser is not a GitHub parser. `yaml.safe_load` accepts every file
  # in this directory, and GitHub rejected one of them at parse time — a
  # zero-second failure with no job to open, no annotation to read, and nothing
  # in the API. The cause was `runner.temp` in a job-level `env:`, where that
  # context does not exist. actionlint knows GitHub's schema and its context
  # availability table; nothing else here does.
  actionlint:
    name: "workflows parse as GitHub reads them"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        env:
          # actionlint shells out to shellcheck for every `run:` block, and
          # shellcheck's info/style findings are shell-style opinions rather than
          # defects — one of them (SC2153 on $WORK, which an earlier step exports
          # through $GITHUB_ENV) it cannot avoid, because it lints each block
          # alone and cannot see the assignment. This job exists to catch GitHub
          # SCHEMA errors; warning and error stay on, so a real shell bug like
          # SC2115's `rm -rf "$unset/"` still fails the run.
          SHELLCHECK_OPTS: -S warning
        run: |
          set -euo pipefail
          ver=1.7.7
          curl -sSL -o al.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          tar xzf al.tar.gz actionlint
          ./actionlint -color .github/workflows/*.yml

  # ══ PROTO ══════════════════════════════════════════════════════════════════

  proto-vendored:
    name: proto (vendored copies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The enforcement half of tools/sync-proto.sh: canonical file present and
      # banner intact, PROTO_VERSION pinning its protocol integer and sha256,
      # both packaging copies byte-identical, and no plugin.proto anywhere else.
      - name: tools/check-proto.sh
        run: bash tools/check-proto.sh

      # check-proto.sh's rule 4 already fails on ANY unexpected plugin.proto, so
      # a resurrected copy is caught by name. This step exists for the copies
      # whose deletion it cannot see — the committed build artifact — and to
      # spell the six paths out, because "the file is gone" is the assertion
      # somebody will otherwise delete along with the file.
      - name: the copies Phase 0 deleted are still gone
        run: |
          set -euo pipefail
          gone=(
            astra-plugin-cli/proto/plugin.proto
            astra-plugin-sdk-ts/src/plugin.proto
            examples/dice-roller/proto/plugin.proto
            examples/json-tools/proto/plugin.proto
            examples/text-utils/proto/plugin.proto
            examples/telegram-client/telegram-client-0.1.0.zip
          )
          bad=0
          for p in "${gone[@]}"; do
            if [ -e "$p" ]; then
              echo "FAIL $p is back. It was deleted in Phase 0 (c811ca9 / 51e6fc7)." >&2
              echo "     The CLI ships no protocol file, the TS SDK generates its" >&2
              echo "     descriptor from proto/plugin.proto, examples depend on an SDK," >&2
              echo "     and build outputs are not source." >&2
              bad=1
            else
              echo "ok   $p is absent"
            fi
          done
          exit $bad

      # The TypeScript SDK is the one consumer that vendors no .proto: it
      # generates src/generated/descriptor.json from the canonical file and
      # records the hash it used. If that hash is not PROTO_VERSION's, the TS
      # SDK is speaking a protocol nothing else in the repo has.
      - name: the TS descriptor was generated from THIS proto
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^sha256=//p' proto/PROTO_VERSION | head -n1)
          recorded=$(sed -n 's/.*PROTO_SHA256 = "\([0-9a-f]*\)".*/\1/p' \
                     astra-plugin-sdk-ts/src/generated/index.ts | head -n1)
          if [ "$pinned" != "$recorded" ]; then
            echo "FAIL proto/PROTO_VERSION pins   $pinned" >&2
            echo "     generated/index.ts records $recorded" >&2
            echo "     Regenerate: (cd astra-plugin-sdk-ts && bun run generate)" >&2
            exit 1
          fi
          echo "ok   descriptor generated from ${pinned:0:12}…"

  proto-upstream:
    name: proto (upstream drift)
    runs-on: ubuntu-24.04
    env:
      # THE SECRETS CONTEXT IS NOT AVAILABLE IN A JOB- OR STEP-LEVEL `if:`.
      # GitHub rejects the workflow at parse time for `if: secrets.X != ''`.
      # A job-level `env:` hoist is the only supported shape, and every step
      # below branches on this string, never on `secrets` directly.
      HAVE_TOKEN: ${{ secrets.ASTRA_REPO_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - name: which mode this job is running in
        run: |
          set -euo pipefail
          if [ "$HAVE_TOKEN" = yes ]; then
            echo "MODE=full"    >> "$GITHUB_ENV"
            echo "### proto-upstream: **full** — regenerating from the Astra checkout" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MODE=degraded" >> "$GITHUB_ENV"
            {
              echo "### proto-upstream: **DEGRADED — upstream drift was NOT checked**"
              echo
              echo "\`ASTRA_REPO_TOKEN\` is unset. Astra is a private repository, so this"
              echo "run cannot see it — which is the normal state for a pull request from"
              echo "a fork, where GitHub withholds secrets by design."
              echo
              echo "What ran instead: \`proto/ASTRA_PROTO.lock\` was verified against the"
              echo "checked-in protocol. That proves the protocol has not moved since a"
              echo "trusted run last compared it with the daemon. It proves nothing about"
              echo "the daemon as it stands today."
              echo
              echo "**The daemon's \`spec/{limits,wire}.yaml\` mirror was NOT checked either.** The"
              echo "\`couplings\` job runs \`gen-limits.mjs --check\` with no Astra checkout, so"
              echo "it verifies the six SDK files and skips the daemon block; the daemon's"
              echo "own \`assert!\` only compares its constants with the mirror beside them, and"
              echo "a regeneration moves both. A spec edit that never reached the daemon is"
              echo "green everywhere until a full-mode run says otherwise."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── degraded mode ────────────────────────────────────────────────────
      #
      # proto/ASTRA_PROTO.lock is written by tools/gen-proto-lock.sh — from a
      # full-mode run of this job, or by a maintainer holding both checkouts —
      # and committed. It records (a) the sha256 of proto/plugin.proto and (b) the
      # sha256 of the astra.proto it was cut from, as of the last time the two
      # repos were actually compared. Verifying it here means: nobody has
      # changed the protocol since that comparison. A PR that DOES change the
      # protocol fails this job with a message saying a maintainer must re-run
      # it — which is correct, and much better than a green tick over an
      # unverified protocol change.
      - name: verify proto/ASTRA_PROTO.lock (degraded mode)
        if: env.MODE == 'degraded'
        run: |
          set -euo pipefail
          lock=proto/ASTRA_PROTO.lock
          [ -f "$lock" ] || { echo "FAIL $lock is missing." >&2; exit 1; }

          get() { sed -n "s/^$1=//p" "$lock" | head -n1; }
          want_plugin=$(get plugin_proto_sha256)
          want_astra=$(get astra_proto_sha256)
          want_protocol=$(get protocol)

          have_plugin=$(sha256sum proto/plugin.proto | cut -d' ' -f1)
          have_astra=$(sed -n 's|^// source-sha256: *||p' proto/plugin.proto | head -n1)
          have_protocol=$(sed -n 's|^// protocol: *||p' proto/plugin.proto | head -n1)

          bad=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "FAIL $1: lock says $2, tree says $3" >&2; bad=1
            else
              echo "ok   $1 $3"
            fi
          }
          check "protocol"            "$want_protocol" "$have_protocol"
          check "plugin.proto sha256" "$want_plugin"   "$have_plugin"
          check "astra.proto sha256"  "$want_astra"    "$have_astra"

          if [ $bad -ne 0 ]; then
            cat >&2 <<'MSG'

          This change moves the protocol, and this run cannot verify it against
          the daemon (no ASTRA_REPO_TOKEN — a fork, most likely). Somebody who
          can see the private Astra repository has to regenerate the slice from
          astra.proto, confirm it is byte-identical to proto/plugin.proto, and
          rewrite proto/ASTRA_PROTO.lock. Two ways, same code:

              tools/gen-proto-lock.sh --astra-dir ../Astra/astra-rs

          from a maintainer's checkout, or re-run this job with the token, which
          runs that script with --check.

          Do NOT hand-edit the lock to make this pass. Its whole value is that
          the hashes in it were produced by a process that could see upstream.
          MSG
            exit 1
          fi
          echo
          echo "NOTE: upstream was NOT contacted. This is the degraded check."

      # The other half of C12, and the half a fork PR actually sees. There is no
      # degraded equivalent of the comparison — no lock file records the daemon's
      # language list — so this prints what was not verified and exits 0. A skip
      # that looks like a pass is the failure mode this whole job is arranged
      # around; the script names the ten codes it took on trust, and names the
      # two checks that DID run without a checkout, so the line is usable rather
      # than merely present.
      - name: C12 the locale vocabulary was NOT compared (degraded mode)
        if: env.MODE == 'degraded'
        run: |
          set -euo pipefail
          out=$(python3 tools/check-locales.py --rules C12)
          echo "$out"
          {
            echo "### locales: **C12 NOT VERIFIED — the vocabulary was not compared with the daemon's**"
            echo
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── full mode ────────────────────────────────────────────────────────
      #
      # `ref` is a repository variable, not a hard-coded branch. The slicer
      # (`astra-rs/tools/proto-slice`) and the surface file it reads land in
      # Astra on `feat/plugin-production` and reach `main` only when that merges
      # — so between the two events, a checkout pinned to `main` gives this job
      # a tree with no slicer in it. Set `vars.ASTRA_REF` to the branch during
      # that window and DELETE the variable once it is on main; the default is
      # `main`, which is where this must end up.
      - name: checkout Astra
        if: env.MODE == 'full'
        uses: actions/checkout@v4
        with:
          repository: mihailinl/Astra
          ref: ${{ vars.ASTRA_REF || 'main' }}
          token: ${{ secrets.ASTRA_REPO_TOKEN }}
          path: _astra
          # The slicer reads astra.proto and plugin-surface.toml only; no history
          # is needed and the repo is large.
          fetch-depth: 1

      # A missing slicer must not surface as `cargo: manifest path … does not
      # exist`. That error names a path and no cause, and the cause here is
      # always the same one: this Astra ref predates the slicer.
      - name: the Astra checkout carries the slicer
        if: env.MODE == 'full'
        # SECURITY: the ref reaches the shell through `env`, never through `${{ }}`
        # interpolated into the script. A repository variable is maintainer-set,
        # but a value containing a quote would still be pasted straight into the
        # command line, and "it is only a maintainer" is how that class of bug
        # gets written everywhere.
        env:
          ASTRA_REF: ${{ vars.ASTRA_REF || 'main' }}
        run: |
          set -euo pipefail
          ref="$ASTRA_REF"
          for p in astra-rs/tools/proto-slice/Cargo.toml \
                   astra-rs/astra-proto/plugin-surface.toml \
                   astra-rs/astra-proto/src/astra.proto; do
            [ -f "_astra/$p" ] || {
              echo "FAIL Astra@$ref has no $p" >&2
              cat >&2 <<MSG

          proto/plugin.proto is CUT from Astra's astra.proto by
          astra-rs/tools/proto-slice, using astra-proto/plugin-surface.toml as
          the list of what crosses the boundary. This job regenerates that slice
          and diffs it, so both files must exist in the Astra ref it checks out.

          Checked out: mihailinl/Astra@$ref
          If the slicer is not on that branch yet, set the repository variable
          ASTRA_REF to the branch carrying it (today: feat/plugin-production),
          and delete the variable once it has merged to main.
          MSG
              exit 1
            }
          done
          echo "ok   Astra@$ref carries the slicer and its surface file"

      # C12 — spec/locales.yaml is the ten codes `Settings::validate` accepts.
      #
      # FIRST of the full-mode comparisons, and deliberately ahead of every
      # toolchain and build step: it needs the checkout and a python3, nothing
      # else. Every other cross-repo check in this job sits behind the slicer
      # build and the slice diff, so an unrelated protocol drift takes all of
      # them out at once — which is exactly what happened on the pull request
      # that added this step, and is why it is not sitting there too.
      #
      # Those ten strings are the complete set of values that can reach a plugin
      # in `PluginRegisterRequest.language` or `LanguageChangedMsg.language`, and
      # therefore the only names a bundle's `locales/<code>.json` may take: the
      # daemon selects with `instance.locales.get(language)` on a HashMap and all
      # three SDKs do the same, so a file named anything else is packed,
      # digested, signed, shipped and read by nothing, with no error anywhere.
      #
      # Drift is silent in both directions. A code we declare and the daemon
      # refuses is a locale an author is invited to write that will never be
      # read; a code the daemon gains and we do not is a language `astra-plugin`
      # would refuse to pack for. This is the only job with both trees, so this
      # is the only place the comparison can be made — and it is exactly the
      # reason C13 exists in the CLI's own test suite, where it runs on every
      # fork PR with nothing checked out.
      - name: C12 (full) spec/locales.yaml == the daemon's SUPPORTED_LANGUAGES
        if: env.MODE == 'full'
        run: |
          set -euo pipefail
          python3 tools/check-locales.py --rules C12 --astra-dir _astra/astra-rs
          cat >> "$GITHUB_STEP_SUMMARY" <<'MSG'
          ### locales: **full** — `spec/locales.yaml` was compared with the daemon's own vocabulary
          MSG

      - uses: dtolnay/rust-toolchain@stable
        if: env.MODE == 'full'
      - uses: arduino/setup-protoc@v3
        if: env.MODE == 'full'
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}
      # For gen-limits.mjs below. Pinned rather than trusting whatever node the
      # runner image happens to ship.
      - uses: actions/setup-node@v4
        if: env.MODE == 'full'
        with:
          node-version: "20"
      - uses: Swatinem/rust-cache@v2
        if: env.MODE == 'full'
        with:
          workspaces: _astra/astra-rs/tools/proto-slice
          key: proto-slice

      # The slicer's `--stdout` regenerates the slice in memory, so this compares
      # the daemon's proto AS IT IS TODAY against our checked-in copy — not
      # against whatever Astra last committed to its own generated/ dir. Keeping
      # Astra's committed copy current is Astra's CI's job.
      #
      # Both halves — the byte-for-byte diff and the lock the degraded mode
      # reads — live in tools/gen-proto-lock.sh, and this step runs it in
      # `--check` mode. The generator used to be a heredoc right here, which
      # made "a CI run holding the token" the only thing on earth able to refresh
      # proto/ASTRA_PROTO.lock: a branch that moved the protocol was unmergeable
      # until a maintainer re-ran this job, and a maintainer sitting on both
      # checkouts had no supported way to do the work. Phase 3b was stuck on
      # exactly that. The check and the write are now one code path, so they
      # cannot disagree about the file's contents.
      - name: the slice is current, and so is proto/ASTRA_PROTO.lock
        if: env.MODE == 'full'
        run: bash tools/gen-proto-lock.sh --astra-dir _astra/astra-rs --check

      # C1 with the other half attached. The `couplings` job runs
      # `gen-limits.mjs --check` WITHOUT an Astra checkout, so it verifies the
      # three SDK files against spec/limits.yaml and prints "daemon block:
      # skipped" — the daemon is simply not in the comparison. The daemon's own
      # `const _: () = assert!(…)` compares its constants against the generated
      # mirror in the same file, and a regeneration moves both together, so a
      # mirror left behind by a spec edit compiles green on both sides.
      #
      # Which means the spec -> daemon coupling — the one the STT channel bug
      # (500 daemon / 32 SDK) was about — was checked by nothing at all until
      # this step. It is the only job with both trees, so it is the only place
      # the check can live.
      - name: C1 (full) spec/{limits,wire}.yaml == the daemon's mirror
        if: env.MODE == 'full'
        env:
          ASTRA_RS_DIR: _astra/astra-rs
        run: |
          set -euo pipefail
          node tools/gen-limits.mjs --check
          cat >> "$GITHUB_STEP_SUMMARY" <<'MSG'
          ### limits: **full** — the daemon's generated mirror was compared with `spec/limits.yaml` and `spec/wire.yaml`
          MSG

      # R5 and R6 are the parity rules that need an Astra checkout. R5 asserts
      # each hook row's `daemon_calls` file:line really is where the daemon calls
      # it; R6 asserts each PluginHostService row's `permission` is what
      # `HOST_RPC_PERMISSIONS` — the table `require_permission` reads — actually
      # requires. The `parity` job skips both, loudly. This is where they run.
      #
      # R6 is here rather than in the `parity` job for the same reason as R5: it
      # compares against daemon source, and a rule that silently passes when it
      # cannot see its other half is worse than no rule.
      - name: parity R5, R6 (daemon_calls provenance, permission gates)
        if: env.MODE == 'full'
        run: python3 tools/parity/check.py --rules R5,R6 --astra-dir _astra/astra-rs

      # `plugin.toml` has exactly one definition, and the CLI's copy of it is
      # byte-identical to Astra's.
      #
      # This step used to compare two *forks* — a regex over the daemon's
      # `pub struct Capabilities` against a regex over `CAPABILITY_NAMES` in
      # astra-plugin-cli/src/commands/validate.rs. Task 3.7 deleted both forks:
      # the types now live in the `astra-plugin-manifest` crate, the daemon's
      # `plugins/manifest.rs` is a re-export of it, and this repo vendors the
      # crate under astra-plugin-cli/vendor/. Comparing field names would now be
      # comparing a file with itself.
      #
      # So the question changed, and the check has to change with it. Two things
      # have to hold, and neither implies the other:
      #
      #   1. the vendored copy is the upstream crate, byte for byte — that is
      #      tools/check-manifest-crate.sh, the equivalence test the vendoring
      #      decision was conditional on (plan task 3.7: "vendor with a CI
      #      equivalence test — but say which");
      #   2. the daemon actually *uses* that crate. Without this, someone could
      #      re-fork plugins/manifest.rs and (1) would stay green forever while
      #      comparing the CLI against a crate nothing reads. That is the
      #      original `ui_panels` failure with one more layer of indirection.
      #
      # ASTRA_REF=HEAD, and it is the one place that value is honest. The script
      # defaults to `origin/main` because a MAINTAINER's checkout is on whatever
      # branch they left it on, and reading that is how it once reported drift
      # that did not exist and advised `--sync` over a constant only the vendored
      # copy had. Here the checkout is `actions/checkout` a dozen lines above, at
      # `vars.ASTRA_REF || 'main'`, fetched fresh at depth 1 — so HEAD *is* the
      # named ref, and naming it directly is also what keeps this step correct if
      # `vars.ASTRA_REF` is ever set again: that fetch refspec brings down only
      # the requested branch, so `origin/main` would not exist here to compare
      # against. The script prints the sha and subject it resolved either way.
      - name: one plugin.toml definition (vendored crate == Astra's)
        if: env.MODE == 'full'
        env:
          ASTRA_REPO: ${{ github.workspace }}/_astra
          ASTRA_REF: HEAD
        run: bash tools/check-manifest-crate.sh

      - name: the daemon parses plugin.toml with that crate
        if: env.MODE == 'full'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("_astra/astra-rs/astra-daemon/src/plugins/manifest.rs")
          text = p.read_text()
          if "pub use astra_plugin_manifest::" not in text:
              print("FAIL the daemon's plugins/manifest.rs no longer re-exports", file=sys.stderr)
              print("     astra-plugin-manifest. Either it grew its own fork of the manifest",
                    file=sys.stderr)
              print("     types again — in which case check-manifest-crate.sh is now comparing",
                    file=sys.stderr)
              print("     this repo against a crate the daemon does not read, and is green for",
                    file=sys.stderr)
              print("     no reason — or the delegation moved and this anchor needs updating.",
                    file=sys.stderr)
              sys.exit(1)
          print("ok   the daemon delegates plugins/manifest.rs to astra-plugin-manifest")
          PY

  # ══ SDKs ═══════════════════════════════════════════════════════════════════

  sdk-rust:
    name: sdk-rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: astra-plugin-sdk
          key: sdk-rust-${{ matrix.os }}

      # A test job that runs zero tests is worse than no job: it is a green tick
      # over nothing. `cargo test` exits 0 on an empty suite, so count first.
      # (The count is deliberately over the source, not over cargo's output: a
      # test that fails to COMPILE must fail the build, not vanish from a tally.)
      - name: there is at least one test to run
        run: |
          set -euo pipefail
          n=$(grep -rE '^\s*#\[(tokio::)?test\]' astra-plugin-sdk/src | wc -l | tr -d ' ')
          echo "found $n #[test]/#[tokio::test] attributes in astra-plugin-sdk/src"
          if [ "$n" -lt 1 ]; then
            echo 'FAIL astra-plugin-sdk has no tests, so `cargo test` proves nothing.' >&2
            exit 1
          fi

      - name: cargo test
        run: cargo test --manifest-path astra-plugin-sdk/Cargo.toml --all-targets

      - name: cargo test --doc
        run: cargo test --manifest-path astra-plugin-sdk/Cargo.toml --doc

      - name: cargo clippy
        run: cargo clippy --manifest-path astra-plugin-sdk/Cargo.toml --all-targets

      # The `schema` feature is default-on, so every check above exercises the
      # schemars path and none of them exercises the other one. A plugin author
      # who hand-writes schemas builds with `default-features = false`, and that
      # configuration is where `#[tool]` on a typed argument is supposed to fail
      # with a named sentence rather than a missing-path error — which only
      # holds if the crate still compiles at all without the feature.
      - name: cargo build --no-default-features (the `schema` feature is off)
        run: cargo build --manifest-path astra-plugin-sdk/Cargo.toml --no-default-features

      # astra-plugin-macros is a second published crate, not a module: the SDK
      # depends on it by version, `cargo test -p astra-plugin-sdk` does NOT run
      # its tests, and its own suite is what proves `#[astra::plugin]` expands to
      # the hand-written impl and emits only `::astra_plugin_sdk::…` paths. A
      # regression there breaks every scaffolded plugin and nothing else here
      # would notice.
      - name: cargo test (astra-plugin-macros)
        run: cargo test --manifest-path astra-plugin-macros/Cargo.toml --all-targets

      - name: cargo clippy (astra-plugin-macros)
        run: cargo clippy --manifest-path astra-plugin-macros/Cargo.toml --all-targets

      # `cargo package` refuses files outside the crate root, which is the entire
      # reason astra-plugin-sdk/proto/plugin.proto exists as a copy. If the copy
      # is not in the packaged file list, build.rs cannot compile the protocol
      # from a published .crate and every `cargo add astra-plugin-sdk` fails at
      # the first build — a failure that only ever shows up after publishing.
      - name: the packaged crate carries its proto
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          cd astra-plugin-sdk
          cargo package --list --allow-dirty > /tmp/crate-files.txt
          if ! grep -qx 'proto/plugin.proto' /tmp/crate-files.txt; then
            echo "FAIL proto/plugin.proto is not in the packaged crate:" >&2
            cat /tmp/crate-files.txt >&2
            exit 1
          fi
          echo "ok   proto/plugin.proto ships inside the .crate"

  sdk-python:
    name: sdk-python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.10 is the floor pyproject.toml declares; test the floor, not the
          # runner's default, or `requires-python` is a wish.
          python-version: "3.10"

      - name: install the SDK
        run: python -m pip install --disable-pip-version-check ./astra-plugin-sdk-python

      - name: there is at least one test to run
        run: |
          set -euo pipefail
          n=$(ls astra-plugin-sdk-python/tests/test_*.py | wc -l | tr -d ' ')
          echo "found $n test module(s)"
          [ "$n" -ge 1 ] || { echo "FAIL no tests" >&2; exit 1; }

      # This job used to run `python -m unittest discover` and nothing else,
      # on the reasoning that adding a test runner to a job whose point is a
      # clean install is self-defeating. That reasoning is still right about
      # the INSTALL — which is why the step above is unchanged and still
      # installs the package with no extras — but it stopped being right about
      # the SUITE. Seven of the modules under tests/ now `import pytest`
      # (test_harness, test_ui, test_failure_containment, test_reserved,
      # test_wire, test_run_entrypoint, test_capability_types), so on a runner
      # without pytest `unittest discover` does not skip them, it raises seven
      # ModuleNotFoundError collection errors and exits non-zero. Verified on
      # this tree: without pytest, 44 tests run and the command FAILS; with
      # pytest, `unittest discover` collects 37 (it sees no TestCase in the
      # seven modules and walks past them) while `pytest` collects 134.
      #
      # So: install the `test` extra pyproject.toml already declares, and run
      # pytest, which collects unittest.TestCase classes as well. 134 > 37 in
      # the same tree — this replaces a failing command with a strictly larger
      # passing one, and the clean-install claim is unaffected because the
      # extra is installed in its own step, after it.
      - name: install the test extra (pyproject's own `test` extra)
        run: python -m pip install --disable-pip-version-check "./astra-plugin-sdk-python[test]"

      - name: python -m pytest
        working-directory: astra-plugin-sdk-python
        run: python -m pytest tests -v

      # Same contract as the Rust crate: setuptools packages data from inside the
      # package directory only, so astra_plugin_sdk/proto/plugin.proto is the copy
      # that must reach the wheel. Without it the regeneration path documented in
      # proto/__init__.py has no input.
      - name: the built wheel carries its proto
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir /tmp/wheels astra-plugin-sdk-python
          whl=$(ls /tmp/wheels/*.whl)
          if ! python -c "import zipfile,sys; sys.exit(0 if 'astra_plugin_sdk/proto/plugin.proto' in zipfile.ZipFile(sys.argv[1]).namelist() else 1)" "$whl"; then
            echo "FAIL astra_plugin_sdk/proto/plugin.proto is not in $whl" >&2
            python -c "import zipfile,sys; print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$whl" >&2
            exit 1
          fi
          echo "ok   the proto ships inside the wheel"

  sdk-ts:
    name: sdk-ts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
        working-directory: astra-plugin-sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --frozen-lockfile is the point of committing bun.lock (task 1.10): a
      # dependency that resolved differently for CI than for the author is how a
      # published SDK carries a transitive it was never built against.
      - name: bun install --frozen-lockfile
        run: bun install --frozen-lockfile

      # Snapshot BEFORE anything runs the generator. `pretest` regenerates
      # src/generated/, so a check placed after it would compare the generator
      # with itself and call a stale committed descriptor current.
      - name: snapshot the committed src/generated
        # `rm -rf` first: on a fresh runner the destination is absent and `cp -R`
        # creates it, but if it already exists (anyone running this step twice
        # locally) `cp -R` nests a copy INSIDE it and the diff below compares
        # the wrong trees.
        run: rm -rf /tmp/generated.committed && cp -R src/generated /tmp/generated.committed

      # `pretest` regenerates the descriptor and runs tsc, so this covers the
      # generator, the type-checker and the suite. contract.test.mjs is the
      # canary for 6bb5395: grpc-js silently DROPS a handler whose method is
      # absent from the descriptor, which is how three hooks were registered and
      # never called.
      - name: bun run test
        run: bun run test

      # Two properties in one diff, against the snapshot taken before anything
      # ran the generator:
      #   current      what is committed is what proto/plugin.proto produces
      #   deterministic two runs (pretest's, and this one) agree byte for byte
      # Comparing against the snapshot rather than `git diff` keeps this true on
      # a dirty tree, which is how it can be run by hand before pushing.
      - name: src/generated is current and reproducible
        run: |
          set -euo pipefail
          bun run generate
          if ! diff -r /tmp/generated.committed src/generated; then
            echo "FAIL src/generated/ is not what proto/plugin.proto generates." >&2
            echo "     Regenerate and commit: (cd astra-plugin-sdk-ts && bun run generate)" >&2
            exit 1
          fi
          echo "ok   src/generated regenerates byte-identically"

      # What npm would actually publish. `dist/generated/descriptor.json` is
      # load-bearing at runtime (proto-loader.ts imports it); a tsconfig change
      # that stopped emitting it would produce a package that installs and then
      # throws on first use.
      - name: the packed tarball is the package we think it is
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          bun run build
          bun pm pack --destination /tmp/tgz
          tgz=$(ls /tmp/tgz/*.tgz)
          list=$(tar tzf "$tgz")
          bad=0
          for want in package/dist/index.js package/dist/index.d.ts \
                      package/dist/generated/descriptor.json; do
            grep -qx "$want" <<<"$list" || { echo "FAIL $want missing from the tarball" >&2; bad=1; }
          done
          # One protocol, and the TS SDK is not one of the two consumers that
          # vendor it. A .proto in this tarball means the deleted copy is back.
          if grep -q '\.proto$' <<<"$list"; then
            echo "FAIL the tarball contains a .proto:" >&2
            grep '\.proto$' <<<"$list" >&2
            bad=1
          fi
          [ $bad -eq 0 ] && echo "ok   $(wc -l <<<"$list") files, descriptor included, no proto"
          exit $bad

  # ══ EXAMPLES ═══════════════════════════════════════════════════════════════

  examples-rust:
    name: examples-rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      # Nine crates that all depend on the same SDK and the same tokio/tonic
      # tree. Without a shared target dir each one pays a cold build of the
      # whole graph; with it, the first example warms the other eight.
      CARGO_TARGET_DIR: ${{ github.workspace }}/_target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: astra-plugin-sdk
          key: examples-${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          # For the manifest check below. windows-2022 preinstalls a Python far
          # older than `tomllib` (3.11+), so pin one rather than inherit one.
          python-version: "3.12"

      # Verified against the examples' real dependency graphs, not guessed:
      #   examples/echo-stt      -> rodio 0.19 -> cpal -> alsa-sys   (libasound2-dev)
      #   examples/telegram-client -> reqwest 0.12 default-tls -> openssl-sys
      #                                                          (libssl-dev, pkg-config)
      # Both are unix-only edges: native-tls uses schannel on Windows and rodio
      # uses WASAPI, so windows-2022 needs nothing installed here.
      - name: "apt: pkg-config libasound2-dev libssl-dev"
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libssl-dev

      # E3 — a committed lockfile that nothing resolves against is not a record
      # of anything.
      #
      # This job built every example WITHOUT `--locked`, so cargo re-resolved
      # each one in memory and stayed green over five lockfiles that no longer
      # satisfied their manifests. 1885df7 bumped astra-plugin-{sdk,macros} to
      # 0.7.0 and refreshed the CLI's lock and the macros' lock; the examples'
      # nine locks were not in that commit, and dice-roller, echo-stt, mock-stt,
      # tone-tts and web-chat went on pinning 0.6.0 for a week with no red run
      # anywhere. `cargo metadata --locked` on any of them refuses outright.
      #
      # b28a282 fixed exactly this for astra-plugin-cli and wrote down why: a
      # release resolves with `--locked` and CI did not, so CI could be green on
      # a tree the release cannot build. The examples are the other nine, and
      # four of them (bad-apple, doom, companion-cat, telegram-client) are
      # released as real signed plugins from this repository.
      #
      # TWO steps rather than one flag, deliberately:
      #
      #   * This one resolves ALL nine and reports EVERY failure. `--locked` on
      #     the build loop below aborts at the first, so five stale locks would
      #     take five red runs to find — which is how a flag gets dropped rather
      #     than a lockfile fixed. It refuses before compiling, so it costs
      #     seconds, not a build.
      #   * The FLOOR. `examples/*/Cargo.toml` is a glob over a directory, and a
      #     glob that matches less still prints `ok` for what it did match: the
      #     shrunken-scan failure, which passes for the wrong reason, quietly,
      #     while reading as coverage. Nine is what exists today.
      - name: every example's committed Cargo.lock satisfies its manifest
        run: |
          set -euo pipefail
          n=0
          bad=0
          for m in examples/*/Cargo.toml; do
            n=$((n + 1))
            if err=$(cargo metadata --locked --format-version 1 --manifest-path "$m" 2>&1 >/dev/null); then
              echo "ok   $m"
            else
              {
                echo "FAIL $m — the committed Cargo.lock does not satisfy the manifest."
                printf '%s\n' "$err" | sed 's/^/       /'
                echo "     fix: cargo update -p astra-plugin-sdk -p astra-plugin-macros \\"
                echo "               --manifest-path $m"
                echo "          then commit $(dirname "$m")/Cargo.lock."
                echo "     Do NOT drop --locked to make this pass. Without it, five of these"
                echo "     once sat stale for a week and every run stayed green."
              } >&2
              bad=1
            fi
          done
          if [ "$n" -lt 9 ]; then
            {
              echo "FAIL the SCAN broke, not the rule: examples/*/Cargo.toml matched $n manifest(s),"
              echo "     below the floor of 9 that existed when this step was written. Nothing here"
              echo "     has been verified — this loop only ever reports what it FOUND, so finding"
              echo "     less reads exactly like finding no problem."
              echo "     Either a Rust example was deleted (lower the floor in that same commit)"
              echo "     or the layout moved and this glob no longer reaches it."
            } >&2
            exit 1
          fi
          [ "$bad" -eq 0 ] || exit 1
          echo "ok   $n example lockfiles resolve under --locked"

      # `--locked` here as well as in the step above, and it is not redundant:
      # that step proves the lock SATISFIES the manifest, this one makes the
      # binaries the E2 check inspects the ones the pinned graph produces.
      - name: build every Rust example
        run: |
          set -euo pipefail
          for m in examples/*/Cargo.toml; do
            echo "::group::$m"
            cargo build --release --locked --manifest-path "$m"
            echo "::endgroup::"
          done

      # E2 — the c811ca9 canary. Nine examples pinned `target/release/<name>.exe`
      # and no example declared a [platform] section, so the daemon on Linux
      # tried to spawn a file that cannot exist. The examples are the de-facto
      # documentation of what a manifest looks like, so it propagated into every
      # plugin written by copying one.
      #
      # The assertion is not "no .exe in the string" — it is that entry.command
      # RESOLVES to a file cargo actually produced, on THIS OS, allowing only the
      # EXE_SUFFIX fallback the daemon itself implements. A manifest that names a
      # real file on exactly one of the two platforms fails on the other.
      - name: every example's entry.command resolves to a built binary
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, sys, tomllib
          target = pathlib.Path(os.environ["CARGO_TARGET_DIR"])
          bad = []
          for manifest in sorted(pathlib.Path("examples").glob("*/plugin.toml")):
              if not (manifest.parent / "Cargo.toml").exists():
                  continue
              man = tomllib.loads(manifest.read_text(encoding="utf-8"))
              cmd = man.get("entry", {}).get("command", "")
              if not cmd.startswith("target/"):
                  bad.append(f"{manifest}: entry.command={cmd!r} does not name a cargo output")
                  continue
              # Checked BEFORE resolving, so the message is the useful one on
              # Linux too — where a `.exe` command fails by not existing, and
              # "resolves to nothing" would send the author hunting for a build
              # problem they do not have.
              if cmd.endswith(".exe"):
                  bad.append(f"{manifest}: entry.command={cmd!r} is Windows-only. "
                             f"Extensionless is correct on both platforms; the daemon "
                             f"appends EXE_SUFFIX when it has to.")
                  continue
              # CARGO_TARGET_DIR moved the output; resolve against the real one.
              rel = cmd[len("target/"):]
              cands = [target / rel, target / (rel + ".exe")]
              if not any(c.is_file() for c in cands):
                  bad.append(f"{manifest}: entry.command={cmd!r} resolves to nothing "
                             f"(tried {', '.join(str(c) for c in cands)})")
                  continue
              print(f"ok   {manifest.parent.name}: {cmd}")
          if bad:
              print("\n".join("FAIL " + b for b in bad), file=sys.stderr)
              sys.exit(1)
          PY

  examples-node-python:
    name: examples-node-python
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Both examples depend on an SDK version that is not published yet
      # (json-tools asks for ^0.1.1, text-utils for any). Building them against
      # the registry would test a stale SDK or fail outright, so they are built
      # against the SDKs in THIS tree — which is also the only way this job can
      # catch an SDK change that breaks an example. See the same note in
      # scaffold-roundtrip for the general problem.
      - name: pack the in-repo SDKs
        run: |
          set -euo pipefail
          (cd astra-plugin-sdk-ts && bun install --frozen-lockfile && bun run build \
             && bun pm pack --destination /tmp/tgz)
          echo "SDK_TGZ=$(ls /tmp/tgz/*.tgz)" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir /tmp/wheels astra-plugin-sdk-python

      - name: examples/json-tools (TypeScript)
        working-directory: examples/json-tools
        run: |
          set -euo pipefail
          # `overrides` redirects resolution without touching the declared
          # dependency range, so the manifest under test stays the author's.
          # This edits the checkout, which is disposable and never committed.
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.overrides = { "astra-plugin-sdk": "file:" + process.env.SDK_TGZ };
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '
          bun install
          bunx tsc --noEmit
          bun run build
          test -f dist/index.js
          echo "ok   json-tools type-checks and bundles against the in-repo SDK"
          # §5.6's reference suite, and the thing that makes it a GATE rather
          # than a document. It runs both levels — the level-1 harness and a
          # real gRPC handshake against MockDaemon — so an SDK change that
          # breaks a plugin's behaviour (rather than its types) fails here.
          # `pretest` rebundles with the SDK external, so the plugin under test
          # and the harness testing it share one copy.
          bun run test
          echo "ok   json-tools' reference suite passes against the in-repo SDK"

      - name: examples/text-utils (Python)
        run: |
          set -euo pipefail
          # Install the wheel BY PATH, not by name off a --find-links dir.
          # `--no-index` would also cut off grpcio/protobuf, which are real
          # dependencies this flat dir does not contain, and pip fails with
          # "No matching distribution found for grpcio" before it ever reaches
          # the example. Naming the file is a stronger guarantee than
          # --find-links anyway: there is exactly one candidate and it is ours.
          python -m pip install --disable-pip-version-check /tmp/wheels/astra_plugin_sdk-*.whl
          # ...and prove it, so a published SDK that shadows the local build
          # cannot make this job green with the wrong code under test.
          python - <<'PY'
          import pathlib, sys, astra_plugin_sdk
          want = {}
          init = pathlib.Path("astra-plugin-sdk-python/astra_plugin_sdk/__init__.py")
          exec(next(l for l in init.read_text().splitlines()
                    if l.startswith("__version__")), want)
          if astra_plugin_sdk.__version__ != want["__version__"]:
              sys.exit(f"FAIL the installed SDK is {astra_plugin_sdk.__version__}, "
                       f"but this tree is {want['__version__']} — the example is "
                       "being tested against the wrong SDK.")
          print(f"ok   the in-repo SDK {astra_plugin_sdk.__version__} is what is installed")
          PY
          (cd examples/text-utils/src
           # Importing, not just compiling: the SDK's @tool/@action/@trigger
           # decorators run at import time, so this exercises the registration
           # surface a syntax check would sail past.
           PYTHONPATH=. python -c "import plugin; print('ok   text-utils imports against the in-repo SDK')")
          # §5.6's Python reference suite, for the same reason as json-tools'
          # above: importing proves the decorators run, and nothing more. These
          # 47 tests are what prove the plugin still BEHAVES against this SDK.
          python -m pip install --disable-pip-version-check pytest
          (cd examples/text-utils && python -m pytest tests -q)
          echo "ok   text-utils' reference suite passes against the in-repo SDK"

  # ══ THE AUTHOR'S FIRST FIVE MINUTES ════════════════════════════════════════

  scaffold-roundtrip:
    name: scaffold ${{ matrix.lang }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        lang: [rust, python, typescript]
    defaults:
      run:
        shell: bash
    steps:
      # $WORK is NOT `/tmp`. Under git-bash on windows-2022 that is an MSYS
      # mount which bash understands and Python does not — `pathlib.Path
      # ("/tmp/x")` resolves to `C:\tmp\x`, a directory nothing wrote to, and
      # the archive inspector below "finds no archive" on every Windows leg.
      # RUNNER_TEMP is a native path on both runners; each step normalises its
      # backslashes once, because bash, TOML and JSON all read one as an escape.
      #
      # Set from the environment variable in a step, not from `runner.temp` in a
      # job-level `env:`: the `runner` context does not exist at job level, and
      # naming it there makes GitHub reject the entire file at parse time — a
      # zero-second failure with no job to open and no annotation to read.
      - name: WORK
        run: echo "WORK=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: astra-plugin-cli
          key: scaffold-${{ matrix.os }}
      - uses: oven-sh/setup-bun@v2
        if: matrix.lang == 'typescript'
      - uses: actions/setup-node@v4
        if: matrix.lang == 'typescript'
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          # Needed on every leg: the archive inspector below is Python.
          python-version: "3.12"

      # The CLI's own suite, which nothing else in this workflow runs — so
      # until now `astra-plugin-cli` was built on every leg and tested on none.
      # It holds the bundle format's definition, the shared-vector suite
      # (testdata/bundles, the same directory the daemon and the registry bot
      # read), and the `new -> build -> verify` round trip. One leg per OS is
      # what matters here: the format's Windows hazards — reserved device
      # names, trailing dots, NTFS alternate data streams — are asserted from
      # fixtures precisely because a Linux runner cannot discover them by
      # running anything, and the matrix gives them a real Windows filesystem
      # for free.
      # `--locked` here is not tidiness, it is the only place CI resolves the
      # CLI the way a release does. release-cli.yml builds every leg with
      # --locked; nothing in this workflow did, so CI could be green on a tree
      # the release cannot build — and the failure would surface at a
      # `cli-v*` tag, which is the worst place to find it.
      #
      # The concrete case: the SDK bump to 0.7.0 moved this crate's dependency
      # requirement and left the committed lockfile pinning 0.6.0. Every job
      # here re-resolved it silently and stayed green. `cargo metadata
      # --locked` on that pair refuses outright.
      #
      # So the invariant is: the committed lockfile satisfies the committed
      # manifest, asserted by the CLI's own job, on the same terms the release
      # will use. If this step fails after a version bump, the fix is `cargo
      # update -p astra-plugin-sdk --manifest-path astra-plugin-cli/Cargo.toml`
      # and commit the lockfile — not dropping the flag.
      - name: cargo test (the CLI, including the shared bundle vectors)
        if: matrix.lang == 'rust'
        run: cargo test --locked --manifest-path astra-plugin-cli/Cargo.toml --all-targets

      # Same flag, same reason as above, and this is the exact command
      # release-cli.yml runs — so a green leg here means that leg's release
      # build resolves too. The test step above is gated on the rust leg; this
      # one runs everywhere, which is where the cheap coverage comes from.
      - name: build the CLI
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path astra-plugin-cli/Cargo.toml
          echo "$GITHUB_WORKSPACE/astra-plugin-cli/target/release" >> "$GITHUB_PATH"

      # ── THE UNPUBLISHED-SDK PROBLEM ────────────────────────────────────────
      #
      # A scaffold pins a RELEASED SDK: `astra-plugin-sdk = "0.6"` (crates.io),
      # `astra-plugin-sdk>=0.5,<0.6` (PyPI), `"astra-plugin-sdk": "^0.5.0"` (npm).
      # None of those versions is published yet — the registries are at 0.5.0 /
      # 0.4.0 / 0.4.0 — so a fresh scaffold does not build for anyone until
      # release-sdks.yml runs for the first time. That is a real fact about this
      # repo today, not a CI artefact, and it is exactly what an author hits.
      #
      # So each leg redirects resolution to the SDK in this tree while LEAVING
      # THE DECLARED RANGE ALONE. That matters: if the template's pin stops
      # matching the SDK it will be published from, resolution fails here, in CI,
      # instead of in an author's terminal after the release.
      #
      #   rust   `[patch.crates-io]` appended to the scaffold's Cargo.toml.
      #          Cargo still evaluates `= "0.6"` against the patched package.
      #   python a locally built wheel on `--find-links`, so pip resolves
      #          `>=0.5,<0.6` against the real local version. NOT `--no-index`:
      #          that would also cut off grpcio/protobuf, which the scaffold
      #          genuinely needs and this flat dir does not hold. The step
      #          asserts afterwards that the SDK pip settled on is this tree's,
      #          which is what --no-index was reaching for and is still true
      #          after the SDKs are published.
      #   ts     `overrides` in package.json pointing at a `bun pm pack` tarball.
      #
      # The SDKs are published now, and the pins do resolve from the registries.
      # The redirection below STAYS anyway, and the earlier note that said to
      # delete it was half right: this job gates the code under review, and the
      # tree runs ahead of the registries between releases — testing an author's
      # scaffold against last release's SDK would stop this job from gating
      # anything at all.
      #
      # What that note was actually reaching for is `scaffold-from-registries`,
      # which now exists: one job, no redirection anywhere, three languages
      # resolved from crates.io, PyPI and npm. That is the promise; this is the
      # gate.
      # ───────────────────────────────────────────────────────────────────────

      - name: scaffold, build, package
        env:
          LANG_UNDER_TEST: ${{ matrix.lang }}
        run: |
          set -euo pipefail
          # Both are backslash paths on Windows; TOML and JSON read a backslash
          # as an escape, so normalise once, here.
          ws="${GITHUB_WORKSPACE//\\//}"
          work="${WORK//\\//}"
          mkdir -p "$work/rt" && cd "$work/rt"

          case "$LANG_UNDER_TEST" in
            rust)
              astra-plugin new demo-plugin --lang rust --capabilities tools
              cd demo-plugin
              cat >> Cargo.toml <<EOF

          [patch.crates-io]
          astra-plugin-sdk = { path = "$ws/astra-plugin-sdk" }
          EOF
              cargo build --release
              ;;
            python)
              python -m pip install --disable-pip-version-check build
              python -m build --wheel --outdir "$work/wheels" "$ws/astra-plugin-sdk-python"
              astra-plugin new demo-plugin --lang python --capabilities tools
              cd demo-plugin
              python -m pip install --disable-pip-version-check \
                --find-links "$work/wheels" -r requirements.txt
              # Then force this tree's SDK over whatever the range resolved to.
              # The rust leg above gets this for free: `[patch.crates-io]`
              # overrides a dependency REGARDLESS of the declared range, so it
              # tests this tree even when the scaffold pins a released version.
              # pip has no equivalent — it honours the range, so between a
              # version bump and its publish it would fetch the older released
              # SDK from PyPI and this leg would silently stop testing the tree
              # it exists to gate. Installing the built wheel explicitly makes
              # the two legs mean the same thing.
              #
              # Whether the pin's ARITHMETIC is right is C11's question, and C11
              # knows about the release window. This leg's question is only
              # whether a scaffolded project builds and runs against this tree.
              python -m pip install --disable-pip-version-check \
                --force-reinstall --no-deps "$work"/wheels/astra_plugin_sdk-*.whl
              # The SDK now installed must be THIS tree's — otherwise the leg
              # proves nothing about the SDK it is meant to gate.
              python - "$ws" <<'PY'
          import pathlib, sys, astra_plugin_sdk
          want = {}
          init = pathlib.Path(sys.argv[1], "astra-plugin-sdk-python",
                              "astra_plugin_sdk", "__init__.py")
          exec(next(l for l in init.read_text(encoding="utf-8").splitlines()
                    if l.startswith("__version__")), want)
          if astra_plugin_sdk.__version__ != want["__version__"]:
              sys.exit(f"FAIL the scaffold's pin resolved to SDK "
                       f"{astra_plugin_sdk.__version__}, but this tree is "
                       f"{want['__version__']}.")
          print(f"ok   the scaffold's pin resolved to the in-repo SDK "
                f"{astra_plugin_sdk.__version__}")
          PY
              # Syntax-check without writing __pycache__ into the project: the
              # packer walks src/ and would pack the .pyc.
              python -c "
          import pathlib, sys
          for p in sorted(pathlib.Path('src').rglob('*.py')):
              compile(p.read_text(encoding='utf-8'), str(p), 'exec')
              print('compiled', p)
          "
              ;;
            typescript)
              (cd "$ws/astra-plugin-sdk-ts" && bun install --frozen-lockfile \
                 && bun run build && bun pm pack --destination "$work/tgz")
              tgz=$(ls "$work"/tgz/*.tgz)
              astra-plugin new demo-plugin --lang ts --capabilities tools
              cd demo-plugin
              node -e '
                const fs = require("fs");
                const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
                p.overrides = { "astra-plugin-sdk": "file:" + process.argv[1] };
                fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
              ' "$tgz"
              bun install
              ;;
          esac

          astra-plugin check . --strict
          astra-plugin build .
          ls -l ./*.astraplugin

      # S6 — the test the scaffold ships PASSES, in the project as generated.
      #
      # §5.6's acceptance is "every `astra-plugin new` template contains one
      # passing test", and until this step existed nothing checked the second
      # word. The TypeScript scaffold is why it is worth a step of its own: its
      # package.json declared `"test": "node --test test/*.test.mjs"` while no
      # `test/` directory was ever written, so `npm test` matched nothing,
      # reported `pass 0, fail 0` and exited 0 — a green check that asserted
      # nothing, in the one place a new author looks to learn what a test is.
      #
      # `--capabilities tools` above means every language's generated test is
      # the tool one: it calls the scaffolded `hello` and asserts the answer,
      # rather than asserting the process started.
      #
      # COUNT FIRST, and this is not belt-and-braces. Read the paragraph above
      # again: the regression it describes was a test command that matched
      # nothing, reported `pass 0, fail 0` and exited 0. Running that same
      # command is therefore not evidence the scaffold ships a test — every
      # runner here exits 0 over an empty set. `bun run test` with an empty
      # `test/` gives `tests 0 / pass 0 / fail 0` and exit 0; `cargo test` on a
      # crate with no `#[test]` does the same. (Only pytest dissents, exiting 5
      # on "no tests collected" — by luck, not by our design.)
      #
      # So the step written to catch that regression could not catch its
      # recurrence: it would go green again, in the same way, for the same
      # reason. Assert the DECLARATION exists before running it, and the
      # green means what its name says.
      #
      # Greps, not toolchains: this runs identically on the Windows leg and
      # needs nothing installed. Each pattern is the declaration itself, not
      # the file, so a test file emptied of its cases fails too.
      - name: the scaffold ships a test to run
        env:
          LANG_UNDER_TEST: ${{ matrix.lang }}
        run: |
          set -euo pipefail
          work="${WORK//\\//}"
          cd "$work/rt/demo-plugin"
          case "$LANG_UNDER_TEST" in
            rust)       pat='#\[(tokio::)?test\]' ; where='src' ;;
            python)     pat='def test_'           ; where='tests' ;;
            typescript) pat='^[[:space:]]*(test|it)\(' ; where='test' ;;
          esac
          n=$(grep -rEc "$pat" "$where" 2>/dev/null | awk -F: '{s+=$NF} END {print s+0}')
          echo "$LANG_UNDER_TEST scaffold declares $n test(s) under $where/"
          if [ "$n" -lt 1 ]; then
            echo "FAIL the generated $LANG_UNDER_TEST scaffold declares no test." >&2
            echo "     §5.6 says every template contains one PASSING test. A" >&2
            echo "     runner exits 0 over an empty set, so the run below would" >&2
            echo "     have gone green having asserted nothing — which is how" >&2
            echo "     the TypeScript scaffold shipped testless once already." >&2
            echo "     Fix the template in astra-plugin-cli/src/templates/." >&2
            exit 1
          fi

      - name: the scaffold's own test passes
        env:
          LANG_UNDER_TEST: ${{ matrix.lang }}
        run: |
          set -euo pipefail
          work="${WORK//\\//}"
          cd "$work/rt/demo-plugin"
          case "$LANG_UNDER_TEST" in
            rust)
              cargo test
              ;;
            python)
              python -m pip install --disable-pip-version-check pytest
              python -m pytest -q
              ;;
            typescript)
              bun run test
              ;;
          esac
          echo "ok   the generated $LANG_UNDER_TEST scaffold's test passes"

      # S5 — the scaffolded npm dependency is the unscoped name. `@astra/plugin-sdk`
      # was scaffolded for a scope that was never registered, so every generated
      # TypeScript project 404'd on install. Checked on the GENERATED file, which
      # is the only place it matters.
      - name: the generated manifest names the published packages
        if: matrix.lang == 'typescript'
        run: |
          set -euo pipefail
          work="${WORK//\\//}"
          dep=$(node -e 'const p=require(process.argv[1]);
                         console.log(Object.keys(p.dependencies).join(" "))' \
                "$work/rt/demo-plugin/package.json")
          echo "dependencies: $dep"
          case "$dep" in
            *@astra/plugin-sdk*)
              echo "FAIL the scaffold depends on @astra/plugin-sdk, a scope that does not exist." >&2
              exit 1 ;;
          esac
          grep -q '"astra-plugin-sdk"' "$work/rt/demo-plugin/package.json"

      # ── THE ARCHIVE INSPECTOR ──────────────────────────────────────────────
      #
      # The .astraplugin is what reaches a user. Four properties, and the daemon
      # or the registry depends on each:
      #
      #   manifest  entry.command inside the archive points INTO the archive.
      #             The packer rewrites it; a string-replace used to no-op on any
      #             manifest whose quoting differed, shipping a bundle that told
      #             the daemon to run the author's target/ directory.
      #   exec      the bin entry carries mode 0o755 IN THE ZIP. Not on the
      #             builder's disk — in the central directory, which is the only
      #             copy the extractor on the other machine can read. A bundle
      #             packed on Windows must still be executable on Linux.
      #   mtime     every entry is 1980-01-01, so two builds of the same input
      #             hash the same and the registry can promise reproducibility.
      #   order     namelist() == sorted(namelist()).
      #
      # `order` was an expected failure until task 2.2 landed; it is now enforced
      # like the rest. The ordering is not incidental: BundleBuilder keeps its
      # entries in a BTreeMap keyed by archive path (astra-plugin-cli/src/bundle.rs)
      # and the directory walk sorts by file name, so the namelist is
      # byte-lexicographic on every platform. ARCHIVE_PENDING is left empty
      # deliberately — the inspector fails the job the moment a listed check
      # starts passing, so an exception cannot outlive the work it waited for.
      - name: inspect the archive
        env:
          LANG_UNDER_TEST: ${{ matrix.lang }}
        run: |
          set -euo pipefail
          work="${WORK//\\//}"
          python - "$work/rt/demo-plugin" <<'PY'
          import os, pathlib, sys, tomllib, zipfile

          proj = pathlib.Path(sys.argv[1])
          lang = os.environ["LANG_UNDER_TEST"]
          pending = {p for p in os.environ.get("ARCHIVE_PENDING", "").split(",") if p}

          archives = sorted(proj.glob("*.astraplugin"))
          if len(archives) != 1:
              sys.exit(f"expected exactly one .astraplugin, found {archives}")
          z = zipfile.ZipFile(archives[0])
          names = z.namelist()
          print(f"archive: {archives[0].name}")
          for i in z.infolist():
              print(f"  {i.filename:44} mode={(i.external_attr >> 16) & 0o7777:04o} "
                    f"mtime={i.date_time}")

          results = {}

          # ── manifest ──────────────────────────────────────────────────────
          problems = []
          if "plugin.toml" not in names:
              problems.append("no plugin.toml in the archive")
          else:
              man = tomllib.loads(z.read("plugin.toml").decode("utf-8"))
              src = tomllib.loads((proj / "plugin.toml").read_text(encoding="utf-8"))
              entry = man.get("entry", {})
              cmd, args = entry.get("command", ""), entry.get("args", [])
              if lang == "rust":
                  # The source manifest points at the author's target/ dir; the
                  # packed one must point into the archive. Assert BOTH, so a
                  # rewrite that no-ops (the old string-replace did, on any
                  # manifest whose quoting differed) cannot pass by accident.
                  before = src.get("entry", {}).get("command", "")
                  if not before.startswith("target/"):
                      problems.append(f"the scaffold's entry.command is {before!r}; this check "
                                      f"assumes it names a cargo output before packing")
                  if not cmd.startswith("./bin/"):
                      problems.append(f"entry.command is {cmd!r}, expected ./bin/<binary> — "
                                      f"the packer did not rewrite it")
                  elif cmd[2:] not in names:
                      problems.append(f"entry.command {cmd!r} points at nothing in the archive")
              else:
                  # Interpreted plugins keep their interpreter as entry.command
                  # and name the code in args; nothing is rewritten, but the code
                  # they name has to be in the bundle.
                  if entry != src.get("entry", {}):
                      problems.append(f"entry was rewritten for a {lang} plugin: "
                                      f"{src.get('entry')} -> {entry}")
                  if "-m" in args:                       # python -m package.module
                      want = args[args.index("-m") + 1].replace(".", "/") + ".py"
                  elif args:                             # node dist/index.js
                      want = args[0]
                  else:
                      want, _ = None, problems.append(f"entry.args is empty for {lang}")
                  if want and want not in names:
                      problems.append(f"entry names {want!r}, which is not in the archive")
              if src["plugin"]["id"] != man["plugin"]["id"]:
                  problems.append("the rewrite changed plugin.id")
          results["manifest"] = problems

          # ── exec bit, in the archive ──────────────────────────────────────
          problems = []
          bins = [i for i in z.infolist() if i.filename.startswith("bin/")]
          if lang == "rust":
              if not bins:
                  problems.append("no bin/ entry in a Rust bundle")
              for i in bins:
                  mode = (i.external_attr >> 16) & 0o7777
                  if not mode & 0o111:
                      problems.append(f"{i.filename} is mode {mode:04o} in the archive — "
                                      f"not executable after extraction")
                  # create_system 3 == Unix; the mode bits are only read from a
                  # Unix-host entry, so a DOS-host entry has no mode at all.
                  if i.create_system != 3:
                      problems.append(f"{i.filename} was written with host system "
                                      f"{i.create_system}, so its mode bits are ignored "
                                      f"on extraction")
          elif bins:
              problems.append(f"unexpected bin/ entries in a {lang} bundle: "
                              f"{[i.filename for i in bins]}")
          results["exec"] = problems

          # ── mtimes ────────────────────────────────────────────────────────
          EPOCH = (1980, 1, 1, 0, 0, 0)
          results["mtime"] = [f"{i.filename}: mtime {i.date_time}, expected {EPOCH}"
                              for i in z.infolist() if i.date_time != EPOCH]

          # ── order ─────────────────────────────────────────────────────────
          results["order"] = ([] if names == sorted(names)
                              else [f"entries are not sorted: {names} != {sorted(names)}"])

          # ── verdict ───────────────────────────────────────────────────────
          failed = False
          for check, problems in results.items():
              if check in pending:
                  if problems:
                      print(f"xfail {check}: pending (see ARCHIVE_PENDING in ci.yml)")
                      for p in problems:
                          print(f"      {p}")
                  else:
                      print(f"FAIL  {check}: listed in ARCHIVE_PENDING but it PASSES now.",
                            file=sys.stderr)
                      print("      The work it was waiting for has landed. Delete it from",
                            file=sys.stderr)
                      print("      ARCHIVE_PENDING in .github/workflows/ci.yml.", file=sys.stderr)
                      failed = True
              elif problems:
                  for p in problems:
                      print(f"FAIL  {check}: {p}", file=sys.stderr)
                  failed = True
              else:
                  print(f"ok    {check}")
          sys.exit(1 if failed else 0)
          PY

  # A fresh scaffold, resolved from the REAL registries. No path dependency, no
  # wheel on --find-links, no packed tarball, no overrides.
  #
  # Every other job here redirects resolution at this tree, and should: they are
  # gating the code under review, and the tree runs ahead of the registries
  # between releases. But that means not one of them touches crates.io, PyPI or
  # npm — so the promise this project actually makes to an author ("scaffold it
  # and build it") was, until the SDKs were published, checked by nobody. The
  # comment in scaffold-roundtrip asked for this job by name for that reason.
  #
  # It is the only job that can fail because of something outside this
  # repository: a yanked version, a registry outage, a pin that resolves to a
  # release nobody meant to make. That is not a flaw in it — those are all things
  # an author would hit, and hearing about them here beats hearing about them in
  # an issue.
  scaffold-from-registries:
    name: a fresh scaffold builds from the published SDKs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: astra-plugin-cli
          key: scaffold-registries

      - name: build the CLI
        run: cargo build --release --manifest-path astra-plugin-cli/Cargo.toml

      - name: scaffold and build, three languages, nothing redirected
        run: |
          set -euo pipefail
          CLI="$PWD/astra-plugin-cli/target/release/astra-plugin"
          work="$(mktemp -d)"

          echo "::group::rust"
          "$CLI" new r-demo --lang rust --capabilities tools --output "$work/rust"
          (cd "$work/rust" && cargo build --release && "$CLI" test . --no-build)
          echo "::endgroup::"

          echo "::group::python"
          "$CLI" new p-demo --lang python --capabilities tools --output "$work/python"
          python -m venv "$work/python/.venv"
          "$work/python/.venv/bin/pip" install --disable-pip-version-check -q \
            -r "$work/python/requirements.txt"
          # `astra-plugin test` runs the plugin with whatever `python` is on
          # PATH, which is exactly what an author's terminal does.
          (cd "$work/python" && PATH="$work/python/.venv/bin:$PATH" "$CLI" test .)
          echo "::endgroup::"

          echo "::group::typescript"
          "$CLI" new t-demo --lang ts --capabilities tools --output "$work/ts"
          (cd "$work/ts" && bun install && "$CLI" test .)
          echo "::endgroup::"

      # The pins resolved to at least the versions that carry the session token.
      # A range that silently resolved to an older release would build, pass the
      # harness against the mock daemon, and fail against a real one.
      - name: the resolved versions are the ones that authenticate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          floors = {
              "crates.io": ("https://crates.io/api/v1/crates/astra-plugin-sdk", (0, 6, 0)),
              "PyPI": ("https://pypi.org/pypi/astra-plugin-sdk/json", (0, 5, 0)),
              "npm": ("https://registry.npmjs.org/astra-plugin-sdk", (0, 5, 0)),
          }
          bad = []
          for name, (url, floor) in floors.items():
              req = urllib.request.Request(url, headers={"User-Agent": "astra-ci"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  doc = json.load(r)
              latest = (
                  doc["crate"]["max_version"] if name == "crates.io"
                  else doc["info"]["version"] if name == "PyPI"
                  else doc["dist-tags"]["latest"]
              )
              parts = tuple(int(x) for x in latest.split(".")[:3])
              print(f"{name:<10} {latest}")
              if parts < floor:
                  bad.append(f"{name} serves {latest}, below the {'.'.join(map(str, floor))} "
                             "that first attaches x-session-token")
          if bad:
              raise SystemExit("\n".join(bad))
          PY

  # ══ THE SPECS ══════════════════════════════════════════════════════════════

  parity:
    name: parity (R1-R4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # gen.py reads ONLY spec/hooks.yaml, so --check is a meaningful gate on the
      # checked-in docs being a pure function of the spec.
      - name: the generated parity docs are current
        run: python tools/parity/gen.py --check

      # R1  spec says `stable`, the SDK has no binding (R1b: `n/a` and bound)
      # R2  an SDK binds an rpc with no spec row, or in the wrong direction
      # R3  the proto declares a plugin-facing rpc no row mentions (R3b/R3c)
      # R4  a `planned` row is past its grace_until
      #
      # R5 is deliberately absent: it asserts each row's daemon_calls file:line
      # against the Astra checkout this repo does not have. It runs in
      # proto-upstream's full mode. Listing the rules explicitly (rather than
      # running everything and tolerating R5's skip) keeps a silent skip from
      # ever being mistaken for a pass.
      # R7 is deliberately absent here too, for the opposite reason to R5: it
      # needs a plugin that has been RUN, and this job has no toolchain. It runs
      # in `conformance` below, which builds one.
      - name: the spec and the SDK sources agree
        run: python tools/parity/check.py --rules R1,R2,R3,R4

  # ── docgen (6.2) ───────────────────────────────────────────────────────────
  #
  # The bug: `docs/en` landed in one commit and was never touched again while
  # nine commits reshaped the CLI, the manifest crate, the proto and the three
  # SDKs. The audit found ~28 false claims, and the largest class of them was a
  # reference page describing an interface that had moved — `cli.md` documenting
  # a `ui_panels` capability no daemon ever had, a scaffold path the CLI does
  # not write, and a `RUST_LOG` that did nothing.
  #
  # `docs/en/reference/` is therefore generated from the sources it describes,
  # and this job is the half that makes that mean something: a checked-in page
  # that is not what a fresh run produces fails the build, with a diff.
  #
  # It needs a Rust toolchain because `cli.md` is generated by RUNNING
  # `astra-plugin --help`. Reading `main.rs` alone would be a second parser for
  # clap's derive macros, i.e. another thing that can silently disagree with the
  # tool; asking the binary cannot.
  docgen:
    name: docgen (docs/en/reference)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: astra-plugin-cli
          key: docgen

      - name: build the CLI docgen reads the flags out of
        run: cargo build --release --manifest-path astra-plugin-cli/Cargo.toml

      - name: the generated reference is current
        run: python3 tools/docgen/gen.py --check

      # ── THE CHECK THAT THE CHECK IS ALIVE ──────────────────────────────────
      #
      # A drift check that has quietly stopped reading its source passes forever
      # and protects nothing — and this one has an unusually plausible way to
      # get there, because it parses `--help` output. If clap's rendering
      # changed shape, the parser could yield empty tables that happen to match
      # a `cli.md` regenerated by the same broken parser.
      #
      # So: change one flag's help text, rebuild, and require the check to FAIL.
      # The trap restores `main.rs` however this step exits, and the last line
      # asserts the tree is clean again — a self-test that left a mutated
      # working copy behind would be worse than no self-test.
      - name: a changed flag fails the check
        run: |
          set -euo pipefail
          MAIN=astra-plugin-cli/src/main.rs
          NEEDLE='/// Keep polling until Ctrl+C'
          if ! grep -qF -- "$NEEDLE" "$MAIN"; then
            echo "FAIL this self-test edits '$NEEDLE' in $MAIN, and that line is gone." >&2
            echo "     Point it at another doc comment on an #[arg] and keep the test." >&2
            exit 1
          fi
          cp "$MAIN" /tmp/main.rs.orig
          trap 'cp /tmp/main.rs.orig "$MAIN"' EXIT

          python3 - "$MAIN" "$NEEDLE" <<'PY'
          import sys
          path, needle = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          open(path, "w", encoding="utf-8").write(
              text.replace(needle, "/// DRIFT CANARY — this help text was changed by CI", 1)
          )
          PY

          cargo build --release --manifest-path astra-plugin-cli/Cargo.toml
          if python3 tools/docgen/gen.py --check > /tmp/canary.log 2>&1; then
            echo "FAIL docgen --check passed with a flag's help text changed." >&2
            echo "     cli.md is no longer a function of the clap definitions." >&2
            exit 1
          fi
          echo "ok   the check noticed:"
          grep -m3 '^[+-].*DRIFT CANARY' /tmp/canary.log || sed -n '1,20p' /tmp/canary.log

          cp /tmp/main.rs.orig "$MAIN"
          cargo build --release --manifest-path astra-plugin-cli/Cargo.toml
          python3 tools/docgen/gen.py --check
          git diff --exit-code -- "$MAIN"

  # ── docs (6.1) ─────────────────────────────────────────────────────────────
  #
  # The acceptance criterion for the docs rewrite: every fenced block in docs/
  # is either EXECUTED or carries a marker saying what it is. `--strict` turns
  # a skipped block into a failure, so a sample that could not run because a
  # toolchain is missing goes red rather than quietly counting as fine — which
  # is why this job installs all four toolchains before it runs.
  #
  # The three installs below are not optional and are not caching:
  #   * grpcio/protobuf — the Python samples import astra_plugin_sdk, which
  #     imports grpc. Without it the python-plugin runner can only byte-compile
  #     and raises Skip, which --strict turns into a failure.
  #   * bun install + bun run build in astra-plugin-sdk-ts — the ts-plugin
  #     runner type-checks against THIS tree's SDK and needs both
  #     node_modules/.bin/tsc and dist/index.d.ts (doctest.py:295,301).
  #   * the release CLI — the `cli` runner re-parses every documented command
  #     line with the real clap definitions, and toml-manifest runs
  #     `astra-plugin check --strict`.
  #
  # The link check is here rather than in its own job because it shares the
  # checkout and costs milliseconds: a doc whose samples all run but whose
  # cross-references dangle is still a broken doc.
  docs:
    name: docs (samples execute)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: astra-plugin-cli
          key: docs

      - name: build the CLI the samples are checked against
        run: cargo build --release --manifest-path astra-plugin-cli/Cargo.toml

      - name: the Python samples import the SDK, which imports grpc
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check grpcio protobuf
          python -m pip install --disable-pip-version-check ./astra-plugin-sdk-python

      - name: the TypeScript samples type-check against this tree's SDK
        run: |
          set -euo pipefail
          cd astra-plugin-sdk-ts
          bun install --frozen-lockfile || bun install
          bun run build

      - name: every fenced block in docs/ runs or says why not
        env:
          ASTRA_PLUGIN_BIN: ${{ github.workspace }}/astra-plugin-cli/target/release/astra-plugin
        run: python3 docs/tools/doctest.py --strict

      - name: every relative link in docs/ and every README resolves
        run: python3 docs/tools/linkcheck.py

      # Every locale is a file-for-file mirror of docs/en, as a set equality, in
      # both directions, AND carries the same doctest blocks: same runners in
      # the same order, and every transcript byte-identical to its English
      # original. The set equality alone was not enough — a correction to an
      # English transcript once shipped with all six translations still carrying
      # the claim it retracted, and this step said "0 mismatches", because it
      # only ever compared filenames. The script's docstring records what it
      # deliberately does NOT do (a changed-English-page gate, and meaning), and
      # why each is a maintainer's decision rather than a script's.
      #
      # This step used to name the six locales in its title, which made it a
      # fourth copy of a list that was wrong in all four: it announced
      # `docs/zh-CN`, a directory named for a language Astra cannot be set to.
      # A step name is read by no program, so nothing could ever have caught it.
      # The set lives in docs/tools/locales.py now, and C14 in the `couplings`
      # job is what compares it with the directories that are actually there.
      - name: every locale mirrors docs/en, page for page and sample for sample
        run: python3 docs/tools/mirror.py

  # ── conformance (5.7) ──────────────────────────────────────────────────────
  #
  # R1-R4 read source; this reads behaviour. `astra-plugin test` starts each
  # reference plugin the way the daemon starts it, drives every hook its
  # capabilities imply, and writes a report; R7 then checks each report against
  # spec/hooks.yaml. Together they are the claim the spec cannot otherwise make:
  # a hook cannot be committed as `stable` while returning UNIMPLEMENTED.
  #
  # The four examples are chosen for coverage of the hook table, not for
  # variety: dice-roller is tools + actions + triggers, mock-stt is the STT
  # bidi stream (fed the wake-word seed burst, which is what exposed the
  # 32-vs-500 audio channel), tone-tts is TTS, companion is ui_contributions.
  # `ai_provider` has no example yet and is therefore NOT covered here — said
  # out loud, because a coverage gap nobody names becomes a coverage gap
  # everybody assumes is filled.
  #
  # Python and TypeScript are not here either. Their examples need an SDK that
  # is not published (see scaffold-roundtrip's UNPUBLISHED-SDK note), and a
  # conformance job that half-installs an SDK reports on the installation
  # rather than on the plugin. When the SDKs publish, add them: `astra-plugin
  # test` drives a process and does not care what language wrote it, which is
  # the whole reason it spawns instead of linking.
  conformance:
    name: conformance (R7)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            astra-plugin-cli
            astra-plugin-sdk
          key: conformance

      # The vendored copy `astra-plugin test` compiles in. It has to be
      # byte-identical to the generated one, or the CLI is enforcing a hook list
      # that is not the spec's. `cargo test` asserts this too; doing it here as
      # well means the failure names the file rather than a test.
      - name: the CLI's vendored hook list is the generated one
        run: diff -u spec/generated/conformance.json astra-plugin-cli/src/conformance.json

      - name: build the CLI
        run: cargo build --release --manifest-path astra-plugin-cli/Cargo.toml

      - name: run the conformance suite on the reference plugins
        run: |
          set -euo pipefail
          CLI="$PWD/astra-plugin-cli/target/release/astra-plugin"
          mkdir -p _conformance
          # Assert the report LANDED, here, in the loop that names it.
          #
          # The verifying step below globs `_conformance/*.json` and checks
          # whatever it finds. A producer that exits 0 without writing its
          # report therefore removes itself from the check silently: the glob
          # yields one fewer path, R7 agrees with the ones that remain, and a
          # job called `conformance (R7)` goes green having verified a subset
          # it never named.
          #
          # The floor is not a count. These three loops already enumerate every
          # expected report — 4 examples, 9 Rust templates, 9 templates in two
          # more languages — so each one asserts its own, by name, and a loss
          # is reported against the thing that failed to produce it rather than
          # as a total lower than some guess. Same reason `docs/tools/doctest.py`
          # checks its roots individually.
          for example in dice-roller mock-stt tone-tts companion; do
            echo "::group::astra-plugin test examples/$example"
            "$CLI" test "examples/$example" --report "_conformance/$example.json"
            test -s "_conformance/$example.json" || {
              echo "FAIL astra-plugin test exited 0 but wrote no report for $example." >&2
              echo "     Every report below is checked; a missing one is not." >&2
              exit 1; }
            echo "::endgroup::"
          done

      # Every template, scaffolded and driven. `astra-plugin new` offers nine
      # starting points; a starting point that does not pass the project's own
      # conformance suite is a starting point that teaches the wrong thing on
      # day one. The `[patch.crates-io]` is the unpublished-SDK workaround
      # scaffold-roundtrip explains at length — the scaffold's declared pin is
      # left alone, so a pin that stops matching the SDK still fails here.
      - name: every `astra-plugin new` template passes conformance
        run: |
          set -euo pipefail
          CLI="$PWD/astra-plugin-cli/target/release/astra-plugin"
          SDK="$PWD/astra-plugin-sdk"
          MACROS="$PWD/astra-plugin-macros"
          WORK="$(mktemp -d)"
          for template in tool tts stt stt-streaming ai-provider ui action-trigger client blank; do
            echo "::group::astra-plugin new --template $template"
            "$CLI" new "t-$template" --lang rust --template "$template" --output "$WORK/$template"
            # printf, not a heredoc: a heredoc terminator inside a YAML block
            # scalar has to sit at column 0, which no indentation here allows.
            printf '\n[patch.crates-io]\nastra-plugin-sdk = { path = "%s" }\nastra-plugin-macros = { path = "%s" }\n' \
              "$SDK" "$MACROS" >> "$WORK/$template/Cargo.toml"
            "$CLI" test "$WORK/$template" --report "_conformance/template-$template.json"
            test -s "_conformance/template-$template.json" || {
              echo "FAIL no report written for the $template template (Rust)." >&2
              exit 1; }
            echo "::endgroup::"
          done

      # The same nine templates in the other two languages. `astra-plugin test`
      # drives a PROCESS and does not care what wrote it, so the only reason
      # this was Rust-only was the unpublished SDKs — and the workaround is the
      # one every other job already uses (a `bun pm pack` tarball behind an
      # `overrides`, a wheel installed by path). It earns its keep: at the time
      # it was added, five of these eighteen scaffolds FAILED — `tts` and `stt`
      # threw out of the hook their capability makes required, in both
      # languages, and `ai-provider` scaffolded an empty plugin that answered
      # UNIMPLEMENTED.
      - name: build the Python and TypeScript SDKs for the scaffolds
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir /tmp/wheels astra-plugin-sdk-python
          python -m pip install --disable-pip-version-check /tmp/wheels/astra_plugin_sdk-*.whl
          (cd astra-plugin-sdk-ts && bun install --frozen-lockfile && bun run build \
             && bun pm pack --destination /tmp/tgz)
          echo "SDK_TGZ=$(ls /tmp/tgz/*.tgz)" >> "$GITHUB_ENV"

      - name: every Python and TypeScript template passes conformance
        run: |
          set -euo pipefail
          CLI="$PWD/astra-plugin-cli/target/release/astra-plugin"
          WORK="$(mktemp -d)"
          for template in tool tts stt stt-streaming ai-provider ui action-trigger client blank; do
            for lang in python typescript; do
              echo "::group::astra-plugin new --lang $lang --template $template"
              proj="$WORK/$lang-$template"
              "$CLI" new "t-$template" --lang "$lang" --template "$template" --output "$proj"
              if [ "$lang" = typescript ]; then
                node -e '
                  const fs = require("fs");
                  const f = process.argv[1] + "/package.json";
                  const p = JSON.parse(fs.readFileSync(f, "utf8"));
                  p.overrides = { "astra-plugin-sdk": "file:" + process.env.SDK_TGZ };
                  fs.writeFileSync(f, JSON.stringify(p, null, 2));
                ' "$proj"
                (cd "$proj" && bun install)
              fi
              "$CLI" test "$proj" --report "_conformance/$lang-$template.json"
              test -s "_conformance/$lang-$template.json" || {
                echo "FAIL no report written for the $template template ($lang)." >&2
                exit 1; }
              echo "::endgroup::"
            done
          done

      - name: the reports and the spec agree
        run: |
          set -euo pipefail
          args=()
          for report in _conformance/*.json; do
            args+=(--report "$report")
          done
          python3 tools/parity/check.py --rules R7 "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-reports
          path: _conformance/
          if-no-files-found: warn

  couplings:
    name: couplings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # C0 below needs to resolve an arbitrary older commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # C0 — `ASTRA_TOOLING_REF` in plugin-release.yml names a commit that
      # exists here and carries the CLI.
      #
      # That literal is how the reusable release workflow finds the
      # `astra-plugin` it packs every author's bundle with. It cannot be an
      # expression: no context tells a reusable workflow its own repository and
      # commit. So it is a SHA typed by hand, in a file whose only real exercise
      # is somebody tagging a plugin release — and when it is wrong the job dies
      # in a foreign repository, with a message about a missing directory,
      # roughly never in front of the person who mistyped it.
      #
      # Both failures this catches have already happened: a pin whose checkout
      # step did not exist, and — while fixing that — a SHA off by six
      # characters in the middle.
      - name: C0 the release workflow's tooling pin resolves
        run: |
          set -euo pipefail
          ref=$(grep -oP '^\s*ASTRA_TOOLING_REF:\s*"\K[0-9a-f]+' \
                  .github/workflows/plugin-release.yml || true)
          if [ -z "$ref" ]; then
            echo "::error::no ASTRA_TOOLING_REF in .github/workflows/plugin-release.yml"
            exit 1
          fi
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ASTRA_TOOLING_REF is not a 40-hex commit: '$ref'"
            exit 1
          fi
          if ! git cat-file -e "$ref^{commit}" 2>/dev/null; then
            echo "::error::ASTRA_TOOLING_REF $ref is not a commit in this repository."
            echo "Every plugin release checks this repository out at that SHA and fails if it is not there."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$ref" HEAD; then
            echo "::error::ASTRA_TOOLING_REF $ref is not an ancestor of this commit —"
            echo "it names a commit from a branch that may be rewritten or deleted."
            exit 1
          fi
          if ! git cat-file -e "$ref:astra-plugin-cli/Cargo.toml" 2>/dev/null; then
            echo "::error::$ref has no astra-plugin-cli/Cargo.toml, so"
            echo "\`cargo install --path astra-tooling/astra-plugin-cli\` has nothing to build."
            exit 1
          fi
          echo "ok    ASTRA_TOOLING_REF $ref is an ancestor and carries the CLI"

          # …and the step that puts the source where the build expects it still
          # exists. It did not, for the whole life of this file: the build's
          # `working-directory` named a path nothing created.
          grep -q 'path: astra-tooling' .github/workflows/plugin-release.yml || {
            echo "::error::nothing checks the tooling out into astra-tooling/, so"
            echo "the \`Build astra-plugin\` step's working-directory does not exist."
            exit 1
          }
          echo "ok    the tooling checkout writes astra-tooling/"

      # C1 — the shared numeric limits. The motivating bug: the streaming-STT
      # audio channel was 500 in the daemon and 32 in the Rust SDK, and the
      # mismatch silently truncated every utterance. The daemon's half of this
      # is a const_assert! next to its own constants; this is the SDK half.
      #
      # HALF, literally: with no Astra checkout the generator prints "daemon
      # block: skipped" and this step passes on the six SDK files alone. The
      # spec -> daemon comparison needs both trees and runs in proto-upstream's
      # full mode ("C1 (full)"). Do not read a green tick here as "the daemon
      # agrees with the spec" — it cannot see the daemon.
      #
      # One generator, two specs. `spec/wire.yaml` holds the gRPC metadata keys
      # and rides the same `--check`, so a new spec file needed no new CI step.
      # Its failure mode is worse than a limit's: a key nobody wrote is simply
      # absent, and absent is legal for all three, so a drift removes trigger
      # attribution or authentication and raises nothing anywhere.
      - name: C1 spec/{limits,wire}.yaml codegen is current (SDK files only)
        run: node tools/gen-limits.mjs --check

      # C1b — the shared bundle vectors. `testdata/bundles/` is one directory
      # of frozen `.astraplugin` files with their expected verdicts and digests
      # written down beside them, read by three implementations of one format:
      # this repo's packer, the daemon's reader, and the registry bot. The
      # copies in the other two repos are vendored by tools/vendor-testdata.sh
      # and verified against SHA256SUMS by those repos' own suites at run time
      # — so drift is caught there, on every test run, not only here.
      #
      # HALF, like C1: with no Astra or astra-registry checkout,
      # `vendor-testdata.sh --check` reports both as skipped and verifies the
      # canonical directory alone. That is still the check that matters most
      # here, because everything downstream is a copy of it.
      #
      # `generate.mjs --check` is the other half: it regenerates into memory
      # and fails if any golden would change. Without it, an edit to the
      # generator leaves the committed bundles describing an older format while
      # every digest in vectors.json still matches the stale bytes.
      - name: C1b testdata/bundles is self-consistent and freshly generated
        run: |
          set -euo pipefail
          node testdata/bundles/generate.mjs --check
          bash tools/vendor-testdata.sh --check

      # C14 — the documentation's locale directories are languages Astra can
      # actually be set to, and something knows they are there.
      #
      # Two failures in one rule, because they are the same mistake seen from
      # two sides. `docs/zh-CN` was a directory named for a code the daemon
      # refuses; an author reading the docs tree learns that name and writes
      # `locales/zh-CN.json`, which is packed, hashed, signed, installed and
      # read by nothing, with no error at any point. And a locale directory that
      # nothing declares is invisible to mirror.py and doctest.py both — they
      # iterate a tuple, not the filesystem — so a `docs/fr` dropped in tomorrow
      # would be checked by linkcheck.py alone and by nothing that reads it.
      #
      # This is the rule with no skip in it: no checkout, no secret, no token.
      # C12, the comparison of spec/locales.yaml against the daemon's own list,
      # needs the private Astra repository and lives in `proto-upstream`, where
      # it says out loud that it did not run rather than passing quietly.
      - name: C14 the docs locales are languages Astra can be set to
        run: python3 tools/check-locales.py --rules C14

      - name: C2-C11 the couplings nothing else checks
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re, subprocess, sys, tomllib

          ROOT = pathlib.Path(".")
          fails: list[str] = []
          def check(ok, msg, detail=""):
              print(("ok   " if ok else "FAIL ") + msg)
              if not ok:
                  fails.append(msg + (("\n       " + detail) if detail else ""))

          read = lambda p: (ROOT / p).read_text(encoding="utf-8")

          # ── C2  PROTOCOL_VERSION is one number, in four places ─────────────
          proto_version = int(re.search(r"^protocol=(\d+)$", read("proto/PROTO_VERSION"),
                                        re.M).group(1))
          versions = {
              "rust":   int(re.search(r"PROTOCOL_VERSION: u32 = (\d+)",
                                      read("astra-plugin-sdk/src/protocol.rs")).group(1)),
              "python": int(re.search(r"^PROTOCOL_VERSION = (\d+)",
                                      read("astra-plugin-sdk-python/astra_plugin_sdk/protocol.py"),
                                      re.M).group(1)),
              "ts":     int(re.search(r"PROTOCOL_VERSION = (\d+)",
                                      read("astra-plugin-sdk-ts/src/protocol.ts")).group(1)),
          }
          check(len(set(versions.values())) == 1,
                "C2 all three SDKs report the same PROTOCOL_VERSION", repr(versions))
          check(all(v == proto_version for v in versions.values()),
                f"C2 PROTOCOL_VERSION == proto/PROTO_VERSION ({proto_version})", repr(versions))

          # ── C2b  the floor is ONE decision, not three ──────────────────────
          # MIN_SUPPORTED_DAEMON_PROTOCOL decides which shipped Astras a plugin
          # built on these SDKs will talk to at all. Three copies of that
          # decision, in three languages, published on three registries: if one
          # is raised and the others are not, the same plugin logic is usable in
          # Python and dead in Rust, and the author has no way to see why. There
          # is no proto/PROTO_VERSION line to anchor it to — the floor is a
          # policy, not a wire fact — so the only available check is that the
          # three agree with each other. Raise it in all three or in none.
          floors = {
              "rust":   int(re.search(r"MIN_SUPPORTED_DAEMON_PROTOCOL: u32 = (\d+)",
                                      read("astra-plugin-sdk/src/protocol.rs")).group(1)),
              "python": int(re.search(r"^MIN_SUPPORTED_DAEMON_PROTOCOL = (\d+)",
                                      read("astra-plugin-sdk-python/astra_plugin_sdk/protocol.py"),
                                      re.M).group(1)),
              "ts":     int(re.search(r"MIN_SUPPORTED_DAEMON_PROTOCOL = (\d+)",
                                      read("astra-plugin-sdk-ts/src/protocol.ts")).group(1)),
          }
          check(len(set(floors.values())) == 1,
                "C2b all three SDKs accept the same oldest daemon", repr(floors))
          check(all(v <= proto_version for v in floors.values()),
                f"C2b the floor is not above the protocol the SDKs speak ({proto_version})",
                repr(floors))

          # ── C3  the TS descriptor's provenance ─────────────────────────────
          pinned = re.search(r"^sha256=([0-9a-f]+)$", read("proto/PROTO_VERSION"), re.M).group(1)
          recorded = re.search(r'PROTO_SHA256 = "([0-9a-f]+)"',
                               read("astra-plugin-sdk-ts/src/generated/index.ts")).group(1)
          check(pinned == recorded, "C3 the TS descriptor records PROTO_VERSION's sha256",
                f"{pinned} != {recorded}")

          # ── C4  a package's version, everywhere it is written ──────────────
          py_pyproject = re.search(r'^version = "([^"]+)"',
                                   read("astra-plugin-sdk-python/pyproject.toml"), re.M).group(1)
          py_dunder = re.search(r'__version__ = "([^"]+)"',
                                read("astra-plugin-sdk-python/astra_plugin_sdk/__init__.py")).group(1)
          check(py_pyproject == py_dunder,
                "C4 pyproject version == __version__",
                f"pyproject {py_pyproject} != __version__ {py_dunder}")

          rust_v = re.search(r'^version = "([^"]+)"',
                             read("astra-plugin-sdk/Cargo.toml"), re.M).group(1)
          ts_v = json.loads(read("astra-plugin-sdk-ts/package.json"))["version"]
          for name, path, ver in (("rust", "astra-plugin-sdk/CHANGELOG.md", rust_v),
                                  ("python", "astra-plugin-sdk-python/CHANGELOG.md", py_pyproject),
                                  ("ts", "astra-plugin-sdk-ts/CHANGELOG.md", ts_v)):
              top = re.search(r"^## \[([^\]]+)\]", read(path), re.M)
              check(top is not None and top.group(1) == ver,
                    f"C4 {name} CHANGELOG's newest entry is {ver}",
                    f"newest entry is {top.group(1) if top else '(none)'}")

          # ── C5  the capability vocabulary, inside this repo ────────────────
          # Equality WITH the daemon needs the private Astra checkout and lives in
          # proto-upstream's full mode. This half must gate every PR, so it asks a
          # question answerable from this repo alone: does anything here use a
          # capability name the daemon would reject?
          #
          # The vocabulary moved in task 3.7. It used to be a `CAPABILITY_NAMES`
          # list in astra-plugin-cli/src/commands/validate.rs — a fork, which is
          # how `ui_panels` got here. It now lives once, in the shared
          # `astra-plugin-manifest` crate, vendored under astra-plugin-cli/vendor/
          # and held byte-identical to Astra's copy by
          # tools/check-manifest-crate.sh. Reading it there rather than from
          # validate.rs is the point: this check must anchor on the definition,
          # not on a restatement of it, or it goes green on the wrong file.
          CAPS_RS = "astra-plugin-cli/vendor/astra-plugin-manifest/src/capabilities.rs"
          m = re.search(r"CAPABILITY_NAMES: &\[&str\] = &\[(.*?)\];", read(CAPS_RS), re.S)
          check(m is not None,
                f"C5 the capability vocabulary is where it is expected ({CAPS_RS})",
                "anchor lost: no `CAPABILITY_NAMES: &[&str] = &[...]` in that file. The list is "
                "defined in Astra's astra-plugin-manifest crate and vendored here; if it moved, "
                "re-point this check and tools/check-manifest-crate.sh's IDENTICAL list together.")
          vocab = set(re.findall(r'"([a-z_]+)"', m.group(1))) if m else set()
          check(len(vocab) == 10, f"C5 the CLI knows {len(vocab)} capabilities", repr(sorted(vocab)))

          # The glob is seeded by the examples directory, so the directory IS
          # the enumeration — use it, instead of trusting the glob to have
          # matched. `unknown` is a NEGATIVE assertion over whatever the glob
          # returned: nought manifests means nought unknown capabilities means
          # green, and the same holds for any example that quietly lost its
          # plugin.toml. That is also a defect worth naming on its own, since
          # an example without a manifest is not an example.
          example_dirs = sorted(d for d in ROOT.glob("examples/*") if d.is_dir())
          manifests = sorted(ROOT.glob("examples/*/plugin.toml"))
          check(bool(example_dirs), "C5 examples/ holds example directories at all",
                "the glob found none — the directory moved, and every check over it is vacuous")
          missing_manifest = [str(d.name) for d in example_dirs
                              if not (d / "plugin.toml").is_file()]
          check(not missing_manifest,
                f"C5 all {len(example_dirs)} example(s) carry a plugin.toml",
                repr(missing_manifest))

          used: dict[str, set[str]] = {}
          for m in manifests:
              caps = tomllib.loads(m.read_text(encoding="utf-8")).get("capabilities", {})
              for k in caps:
                  used.setdefault(k, set()).add(str(m))
          unknown = {k: v for k, v in used.items() if k not in vocab}
          check(not unknown, "C5 every example declares only real capabilities", repr(unknown))

          # `core` is the spec's own bucket for hooks no capability gates
          # (Register, HealthCheck, Shutdown); it is not a manifest key.
          spec_caps = set(re.findall(r"^\s+capability:\s*(\S+)", read("spec/hooks.yaml"), re.M))
          stray = spec_caps - vocab - {"core"}
          check(not stray, "C5 spec/hooks.yaml uses only real capabilities", repr(sorted(stray)))

          # ── C6  strings that outlived what they named ──────────────────────
          # A dated exception list, not a mute. Every entry must STILL MATCH: fix
          # the file and this check tells you to delete the line, so an exception
          # cannot outlive the thing it was waiting for.
          PATTERNS = {
              "@astra/plugin-sdk":
                  "the npm scope that was never registered; the package is `astra-plugin-sdk`",
              "ui_panels":
                  "a capability the daemon has never had; it is `ui_contributions`",
              "publish-rust.yml": "deleted by task 1.10; the release train is release-sdks.yml",
              "publish-python.yml": "deleted by task 1.10; the release train is release-sdks.yml",
              "publish-ts.yml": "deleted by task 1.10; the release train is release-sdks.yml",
              # A PATH SEGMENT, not the bare string. `zh-CN` appears in prose in
              # eight files that name it in order to call it wrong, and an
              # exception list longer than the set of real hits is a mute with
              # extra steps. What must never come back is the *path* — a link or
              # a directory — because that is the form an author copies into
              # `locales/zh-CN.json`, which is packed, digested, signed and read
              # by nothing.
              #
              # The other form it took — a brace list enumerating the locales, in
              # a step name here, in mirror.py and in doctest.py — is designed
              # out rather than pattern-matched: the set is written down once, in
              # docs/tools/locales.py, and C14 compares it with the directories
              # that are actually there. There is no longer a copy to be wrong.
              "zh-CN/":
                  "our old spelling of Chinese; the code is `zh` (spec/locales.yaml), and no region tag exists anywhere in this system",
          }
          # path -> reason. Keep these keyed to the task that removes them.
          PENDING = {
              # Task 5.8 has LANDED: the install line, the example import and the
              # scaffold's dependency all say `astra-plugin-sdk` now. What is left
              # in these four files is PROSE naming the wrong scope as the bug it
              # was, which is the use C6 exists to allow — so the reasons below
              # are "none", not a task number, and the entries stay. Deleting them
              # would trip "no stale name outside the pending list"; deleting the
              # prose would lose the note a reader needs when they meet the old
              # name in an existing project. The scaffold's REAL dependency name
              # is asserted, on the generated file, by scaffold-roundtrip S5.
              "astra-plugin-cli/src/templates/typescript.rs": "none — a comment explaining the bug",
              "astra-plugin-sdk-ts/src/index.ts": "none — the module docstring names the old scope as wrong",
              "astra-plugin-sdk-ts/README.md": "none — the README says the scope was never registered",
              "astra-plugin-sdk-ts/CHANGELOG.md": "none — the 0.5.0 entry recording the rename",
              "astra-plugin-cli/src/commands/validate.rs": "none — the rename table, correctly",
              "PRODUCTION_PLAN.md": "none — the plan quotes both as the bugs they are",
              # Task 3.7's own account of why the shared manifest crate exists.
              # Both name `ui_panels` as the defect they were written to prevent,
              # which is exactly the use C6 is meant to allow.
              "astra-plugin-cli/Cargo.toml": "none — why the vendored crate is a path dependency",
              "tools/check-manifest-crate.sh": "none — the script header's worked example",
              "astra-plugin-cli/README.md": "none — why the manifest crate is vendored",
              # Task 6.2's generator and the page it renders. The generator's
              # module docstrings say what the old hand-written reference got
              # wrong; the rendered page explains, on the `[capabilities]`
              # section, why deny_unknown_fields is there — `ui_panels` is the
              # worked example. Neither is waiting for anything.
              "tools/docgen/README.md": "none — what the old reference got wrong",
              "tools/docgen/cli.py": "none — the module docstring naming the defect",
              "tools/docgen/manifest.py": "none — the same, plus the rendered rationale",
              "AGENTS.md": "none — the worked `astra-plugin check` failure, quoting the error verbatim",
          }
          # Every locale carries the same four pages, and they all name a retired
          # name in order to call it retired — the C6-sanctioned use, hence
          # "none". `docs/community/` is gone: the five archived translations
          # moved to `docs/<locale>/` and were re-cut from the rewritten English,
          # so there is no longer a frozen tier to exempt and no longer an
          # English/Russian special case.
          #
          # The locale list is imported rather than written out. It used to be
          # written out here, in mirror.py and in doctest.py, and all three said
          # `zh-CN` — a code the daemon cannot be set to, in the file that tells
          # authors what a locale is called. Importing it also changes what the
          # alarm is: a locale added to locales.py whose four pages do not name
          # the retired name now fails "every pending exception is still needed",
          # which is the same failure from the other side.
          sys.path.insert(0, str(ROOT / "docs" / "tools"))
          from locales import LOCALES as DOC_LOCALES
          sys.path.pop(0)

          for lang in DOC_LOCALES:
              PENDING[f"docs/{lang}/1-orientation/what-is-a-plugin.md"] = "none — names the capability that never existed"
              PENDING[f"docs/{lang}/6-operate/troubleshooting.md"] = "none — the misspelt-capability symptom, keyed to the real error"
              PENDING[f"docs/{lang}/migration-0.6.md"] = "none — the 0.6 rename, naming the scope that was never registered"
              PENDING[f"docs/{lang}/reference/manifest.md"] = "none — generated; the deny_unknown_fields rationale and the rename table"

          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True,
                                   check=True).stdout.split()
          hits: dict[str, list[str]] = {}
          # The workflow directory is exempt, and NOT via PENDING. This file
          # defines PATTERNS, so it names all three by construction; and
          # release-sdks.yml's header names the three workflows it replaced,
          # which is the provenance note that makes the replacement reviewable.
          # A PENDING entry would be wrong for both: C6's "every pending
          # exception is still needed" rule exists so an exception dies with the
          # thing it waited for, and neither of these is waiting for anything.
          # (Until the Phase 1 commit, release-sdks.yml was untracked and so
          # invisible to `git ls-files` — this loop would have gone red on the
          # first CI run after the commit that added it.)
          SELF = {".github/workflows/ci.yml", ".github/workflows/release-sdks.yml"}
          # The vendored manifest crate is exempt by PREFIX, and deliberately not
          # via PENDING. Every file under it is a byte-for-byte copy of Astra's
          # astra-plugin-manifest, enforced by tools/check-manifest-crate.sh, so
          # nothing here can be edited to clear a hit — the only way to change
          # those files is to change them upstream and re-sync. A PENDING entry
          # would also be a standing invitation to churn: PENDING's companion
          # rule is "every exception is still needed", so each reword of a doc
          # comment in another repository would land as a red build in this one.
          # What C6 is actually protecting against — a stale name in *this*
          # repo's own prose or code — is unaffected, and the crate's mentions of
          # `ui_panels` are the historical record of the drift it ended.
          VENDORED = "astra-plugin-cli/vendor/"
          for rel in tracked:
              if rel in SELF or rel.startswith(VENDORED):
                  continue
              p = ROOT / rel
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, FileNotFoundError, IsADirectoryError):
                  continue
              for pat in PATTERNS:
                  if pat in text:
                      hits.setdefault(rel, []).append(pat)
          unexpected = {k: v for k, v in hits.items() if k not in PENDING}
          check(not unexpected, "C6 no stale name outside the pending list",
                "\n       ".join(f"{k}: {v} — {PATTERNS[v[0]]}" for k, v in unexpected.items()))
          stale_pending = sorted(set(PENDING) - set(hits))
          check(not stale_pending,
                "C6 every pending exception is still needed",
                "these files are clean now; delete their PENDING entries in ci.yml:\n       "
                + "\n       ".join(stale_pending))

          # ── C7  every host client attaches the session token ───────────────
          # dde9de7: the daemon has required x-session-token on every
          # PluginHostService RPC except Register since SECURITY(B1), and a
          # comment in host_service.rs said "the plugin SDK's HostClient
          # interceptor" attaches it. That interceptor was never written, in any
          # language, so fire_trigger/log/get_config/set_variable/push_to_ui all
          # failed unauthenticated. A grep is a weak oracle for a strong
          # requirement — the real one is Astra's integration test (task 0.2) —
          # but it costs nothing and it would have been red for months.
          for name, path in (("rust", "astra-plugin-sdk/src/auth.rs"),
                             ("python", "astra-plugin-sdk-python/astra_plugin_sdk/host_client.py"),
                             ("ts", "astra-plugin-sdk-ts/src/host-client.ts")):
              check("x-session-token" in read(path),
                    f"C7 the {name} host client names x-session-token", path)

          # ── C8  the Python SDK unblocks stdout ─────────────────────────────
          # 4822352: stdout was block-buffered, so the daemon's supervisor — which
          # reads stdout to learn the plugin is alive — saw nothing and reaped the
          # process at plugin_start_timeout_secs.
          check("line_buffering" in read("astra-plugin-sdk-python/astra_plugin_sdk/plugin.py"),
                "C8 the Python SDK reconfigures stdout to line buffering")

          # ── C9  no protocol text outside a .proto ──────────────────────────
          # 6bb5395: two hand-maintained proto STRINGS lived inline in
          # proto-loader.ts and daemon-client.ts, were written to os.tmpdir() and
          # loaded from there. check-proto.sh finds stray FILES; nothing found
          # these, and one of them still described a ChatService that had been
          # migrated away, so every TS client plugin threw during registration.
          # `inline` is another negative assertion over a glob, so an empty
          # scrape is indistinguishable from a clean one — and `astra-plugin-sdk*`
          # is a PREFIX, which is the fragile kind: rename a directory and the
          # check keeps passing while covering one SDK fewer. The three SDKs are
          # a closed set, so require each to have contributed a file.
          SDK_DIRS = ("astra-plugin-sdk", "astra-plugin-sdk-python", "astra-plugin-sdk-ts")
          inline, scanned = [], {d: 0 for d in SDK_DIRS}
          for pat in ("*.ts", "*.py", "*.rs", "*.mjs", "*.js"):
              for p in ROOT.glob(f"astra-plugin-sdk*/**/{pat}"):
                  if any(part in {"node_modules", "dist", "target", "build", ".venv"}
                         for part in p.parts):
                      continue
                  top = p.relative_to(ROOT).parts[0]
                  if top in scanned:
                      scanned[top] += 1
                  t = p.read_text(encoding="utf-8", errors="ignore")
                  if 'syntax = "proto3"' in t or "syntax = 'proto3'" in t:
                      inline.append(str(p))
          blind = [d for d, n in scanned.items() if n == 0]
          check(not blind, f"C9 scanned all three SDKs ({', '.join(f'{d}={n}' for d, n in scanned.items())})",
                f"scanned no source at all under: {blind} — C9 passes over them vacuously")
          check(not inline, "C9 no inline proto source in any SDK", repr(inline))

          # ── C10  no build output is tracked ────────────────────────────────
          # c811ca9 also deleted a committed telegram-client-0.1.0.zip.
          #
          # testdata/bundles/*.astraplugin is the one exception, and it is an
          # exception to the *reason*, not merely to the rule. Those 27 archives
          # are not output — nothing in this repo builds from them and no
          # release contains them. They are frozen INPUT: the cross-repo test
          # vectors (plan task 3.11), byte-identical copies of which the daemon
          # and the registry check their own readers against, so that a digest
          # or a rejection rule cannot change on one side alone. Regenerating
          # them at CI time would defeat the entire point, since a packer bug
          # would then be baked into the fixtures the packer is judged by.
          #
          # What keeps them honest is not this rule but two others that C10
          # cannot do: `testdata/bundles/generate.mjs --check` (the C1b step in
          # this job) proves they are exactly what the committed generator
          # produces, and testdata/bundles/SHA256SUMS pins the bytes that all
          # three repositories share. The exemption is a path prefix, so an
          # `.astraplugin` committed anywhere else is still caught.
          VECTORS = "testdata/bundles/"
          artifacts = [f for f in tracked
                       if not (f.startswith(VECTORS) and f.endswith(".astraplugin"))
                       and (re.search(r"(^|/)(target|node_modules|__pycache__)/", f)
                            or f.endswith((".exe", ".pyc", ".astraplugin", ".zip",
                                           ".crate", ".tgz")))]
          check(not artifacts, "C10 no build artifacts are tracked", repr(artifacts))

          # ── C11  the CLI's SDK pins accept the SDKs in this tree ───────────
          # A scaffold resolves its pin against a REGISTRY, so the pin must name
          # a version that exists there. scaffold-roundtrip proves the build;
          # this proves the arithmetic, and names the file to edit.
          #
          # There is a window where the in-tree version is deliberately AHEAD of
          # the pin: between the version bump and the publish. The bump lands
          # first so a git-built SDK reports a version distinguishable from the
          # released one; the template cannot be repinned until the publish, or
          # `a fresh scaffold builds from the published SDKs` resolves a version
          # no registry has. Both checks are right; only the window makes them
          # look contradictory.
          #
          # So C11 asks the CHANGELOG, which already records which versions are
          # out. A pin may lag the tree ONLY while the tree's version is still
          # `unreleased` there, and only if it accepts the newest DATED version.
          # The moment that heading gets its date, the pin must accept the new
          # version — so forgetting the post-publish repin fails here rather
          # than in an author's first `astra-plugin new`.
          def changelog_versions(path: str) -> tuple[set[str], list[str]]:
              """(versions marked unreleased, released versions newest-first)."""
              unreleased, released = set(), []
              for m in re.finditer(r"^## \[([^\]]+)\]\s*[—-]\s*(.+)$",
                                   read(path), re.M):
                  ver, when = m.group(1), m.group(2).strip().lower()
                  (unreleased.add(ver) if when.startswith("unreleased")
                   else released.append(ver))
              return unreleased, released
          def cargo_caret(req: str, v: tuple[int, int, int]) -> bool:
              parts = [int(x) for x in req.split(".")]
              lo = tuple(parts + [0] * (3 - len(parts)))
              if lo[0]:
                  hi = (lo[0] + 1, 0, 0)
              elif lo[1]:
                  hi = (0, lo[1] + 1, 0)
              else:
                  hi = (0, 0, lo[2] + 1)
              return lo <= v < hi
          def npm_caret(req: str, v: tuple[int, int, int]) -> bool:
              return cargo_caret(req.lstrip("^"), v)
          def pep_range(req: str, v: tuple[int, int, int]) -> bool:
              for clause in req.split(","):
                  op, num = re.match(r"(>=|<=|==|<|>)([\d.]+)", clause.strip()).groups()
                  b = tuple([int(x) for x in num.split(".")] + [0, 0])[:3]
                  if not {">=": v >= b, "<=": v <= b, "==": v == b,
                          "<": v < b, ">": v > b}[op]:
                      return False
              return True

          tup = lambda s: tuple(int(x) for x in s.split("-")[0].split(".")[:3])
          for name, tmpl, pat, ver, sat, chlog in (
              ("rust", "astra-plugin-cli/src/templates/rust.rs",
               r'astra-plugin-sdk = "([^"]+)"', rust_v, cargo_caret,
               "astra-plugin-sdk/CHANGELOG.md"),
              ("python", "astra-plugin-cli/src/templates/python.rs",
               r'"?astra-plugin-sdk(>=[^"\n,]+(?:,<[^"\n]+)?)"?', py_pyproject, pep_range,
               "astra-plugin-sdk-python/CHANGELOG.md"),
              ("ts", "astra-plugin-cli/src/templates/typescript.rs",
               r'"astra-plugin-sdk": "([^"]+)"', ts_v, npm_caret,
               "astra-plugin-sdk-ts/CHANGELOG.md"),
          ):
              m = re.search(pat, read(tmpl))
              check(m is not None, f"C11 the {name} template still declares an SDK pin", tmpl)
              if not m:
                  continue
              req = m.group(1)
              unreleased, released = changelog_versions(chlog)
              if sat(req, tup(ver)):
                  check(True, f"C11 the {name} scaffold's pin {req!r} accepts {ver}")
              elif ver in unreleased and released and sat(req, tup(released[0])):
                  # The documented window. Say so out loud on every run, because a
                  # release left half-done is the failure this branch permits.
                  check(True,
                        f"C11 the {name} scaffold's pin {req!r} accepts the released "
                        f"{released[0]}; {ver} is unreleased in {chlog}")
                  print(f"       repin {tmpl} to {ver} once it is published")
              else:
                  why = (f"{ver} is marked released in {chlog}, so the pin must accept it"
                         if ver not in unreleased else
                         f"{ver} is unreleased, but the pin does not accept the newest "
                         f"released version either ({released[0] if released else 'none'})")
                  check(False,
                        f"C11 the {name} scaffold's pin {req!r} accepts {ver}",
                        f"{why} — edit {tmpl}, or the SDK version")

          print()
          if fails:
              print(f"{len(fails)} coupling(s) broken:\n", file=sys.stderr)
              for f in fails:
                  print("  " + f, file=sys.stderr)
              sys.exit(1)
          print("couplings: all checks pass.")
          PY

  # ══ THE ONE REQUIRED CHECK ═════════════════════════════════════════════════
  #
  # Branch protection cannot require a matrix job without naming every leg, and
  # a leg added tomorrow would silently not be required. This job depends on all
  # of them, so protecting `ci` is enough — and a job that is SKIPPED (which
  # GitHub counts as neither success nor failure) fails it too.
  ci:
    name: ci
    if: always()
    needs:
      - proto-vendored
      - proto-upstream
      - sdk-rust
      - sdk-python
      - sdk-ts
      - examples-rust
      - examples-node-python
      - scaffold-roundtrip
      - scaffold-from-registries
      - parity
      - docgen
      - docs
      - conformance
      - couplings
    runs-on: ubuntu-24.04
    steps:
      - name: every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          if bad:
              for k, v in bad.items():
                  print(f"FAIL {k}: {v}", file=sys.stderr)
              sys.exit(1)
          print(f"ok   {len(needs)} jobs succeeded")
          PY
