name: Release SDKs

# ─────────────────────────────────────────────────────────────────────────────
# ONE tag releases all three SDKs. It replaces `publish-rust.yml`,
# `publish-python.yml` and `publish-ts.yml`, which were three tags, three
# workflows and zero gates: each one checked out, built and published, and none
# of them ever asked whether the thing it was publishing agreed with anything
# else. That is how 0.5.0 of the Rust SDK reached crates.io with a HostClient
# that could not authenticate a single host RPC.
#
# ── THE TAG ────────────────────────────────────────────────────────────────
#
#   git tag sdk-v0.6.0 && git push origin sdk-v0.6.0
#
# `<semver>` is the RELEASE-TRAIN version, and the train's version is the Rust
# SDK's. The three packages are NOT in lockstep — today they are 0.6.0 (Rust),
# 0.5.0 (Python), 0.5.0 (TypeScript) — because they broke at different times and
# forcing a shared number would mean publishing a Python release whose only
# change is a version bump. The Rust crate is the reference because its version
# has moved for every protocol-affecting change so far.
#
# So the version gate does NOT demand four equal numbers. It demands that every
# version in the tree is the one its own package will be published under, and
# that the tag names the train:
#
#   * tag semver           == astra-plugin-sdk/Cargo.toml version
#   * astra-plugin-macros  == astra-plugin-sdk (these two are ONE package split
#     in two for proc-macro reasons; the SDK depends on the macros crate by
#     version, so they must ship together at the same number)
#   * pyproject version    == astra_plugin_sdk.__version__
#   * each CHANGELOG's newest entry == that package's version
#   * no package's version is already on its registry (that would be a silent
#     no-op publish, or a failed one, depending on the registry)
#
# If you later decide the three should move in lockstep, add the equality here
# and delete this paragraph — but decide it, do not let it happen.
#
# ── THE GATES, IN ORDER ────────────────────────────────────────────────────
#
#   1 versions      cheap, and the most common mistake
#   2 protocol      PROTOCOL_VERSION == proto/PROTO_VERSION's `protocol`
#   3 proto-drift   the checked-in protocol is the daemon's, verified upstream
#   4 parity        R1-R4: the spec, the proto and the SDK sources agree
#   5 ci            the whole matrix — 6 OS legs of SDK tests, the examples,
#                   the scaffold round-trip, the couplings
#   6 conformance   the hook list every SDK must answer
#   7 publish       crates.io (macros, then the SDK), PyPI, npm
#
# Each `needs:` the one before it, so a red gate stops the train rather than
# racing it. 1-4 are seconds; putting them ahead of the matrix means a
# mismatched version costs a minute, not twenty.
#
# ── WHY THE GATES ARE IN THIS ORDER ────────────────────────────────────────
#
# A registry push cannot be undone or replaced. So everything that can be known
# without pushing is checked first, and the last thing checked before the first
# push is whether any registry already holds the version — because finding that
# out after two of the three have gone up is the worst possible moment.
#
# This paragraph used to be a snapshot: it named which versions the registries
# and the tree were at, and asserted that a particular tag passed every gate
# "today". Every number in it was wrong within a fortnight, and a stale snapshot
# in a release workflow is read by somebody deciding whether it is safe to run.
# Whatever the current numbers are, `README.md`'s Publication state table holds
# them and coupling C23 keeps that table honest; this file states the rule
# instead.
#
# **The order is also what makes a half-failed release recoverable.** It did
# fail halfway once — see the note on gate 1 — and the `registries:` input is
# how the remaining leg gets pushed without pretending the finished ones did not
# happen.
#
# ── NO ARTIFACT HAND-OFF ───────────────────────────────────────────────────
#
# Deliberately no actions/upload-artifact between a build and a publish, matching
# Astra's release.yml: that quota is account-wide and, when it fills, fails hard —
# in astra-companion it turned 19 days of green compiles into red CI with nothing
# shipped. Each publish job builds what it publishes, in one job.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "sdk-v*"
  # A dry run is the only way to exercise the gates before the tag exists, and a
  # tag is not something you can take back.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check the gates against, e.g. 0.6.0"
        required: true
      publish:
        description: "Actually publish. Leave false to run gates only."
        type: boolean
        default: false
      registries:
        description: >-
          Which registries to publish to. `all` is the normal release. Name a
          subset only to FINISH a partial one — see the comment on gate 1.
        type: choice
        default: all
        options: [all, crates, pypi, npm, "crates,pypi", "crates,npm", "pypi,npm"]

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress: a cancelled run between two registry pushes leaves
  # the three SDKs at different versions, and no registry lets you take one back.
  group: release-sdks
  cancel-in-progress: false

jobs:
  # ══ GATE 1 ═════════════════════════════════════════════════════════════════
  versions:
    name: "gate 1: versions"
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      rust: ${{ steps.v.outputs.rust }}
      python: ${{ steps.v.outputs.python }}
      ts: ${{ steps.v.outputs.ts }}
      publish: ${{ steps.v.outputs.publish }}
      registries: ${{ steps.v.outputs.registries }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: the tag agrees with every manifest
        id: v
        env:
          # `github.ref_name` is `sdk-v0.6.0` on a tag and the branch name on a
          # dispatch, so the two entry points are normalised here rather than in
          # four expressions further down.
          RAW: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          REGISTRIES: ${{ inputs.registries }}
          DO_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, sys, pathlib

          raw = os.environ["RAW"]
          version = raw[len("sdk-v"):] if raw.startswith("sdk-v") else raw
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", version):
              sys.exit(f"'{raw}' is not a `sdk-v<semver>` tag")

          read = lambda p: pathlib.Path(p).read_text(encoding="utf-8")
          rust = re.search(r'^version = "([^"]+)"', read("astra-plugin-sdk/Cargo.toml"), re.M).group(1)
          # astra-plugin-macros is a second crates.io package, published from this
          # same tag. The SDK depends on it by `version = "<x>", path = "..."`, so
          # cargo resolves the crates.io copy at publish time: a macros crate whose
          # version differs from the SDK's makes `cargo publish` fail after the
          # macros crate has already gone up, which is unrecoverable.
          macros = re.search(r'^version = "([^"]+)"',
                             read("astra-plugin-macros/Cargo.toml"), re.M).group(1)
          macros_dep = re.search(r'astra-plugin-macros = \{ version = "([^"]+)"',
                                 read("astra-plugin-sdk/Cargo.toml")).group(1)
          pyproject = re.search(r'^version = "([^"]+)"',
                                read("astra-plugin-sdk-python/pyproject.toml"), re.M).group(1)
          dunder = re.search(r'__version__ = "([^"]+)"',
                             read("astra-plugin-sdk-python/astra_plugin_sdk/__init__.py")).group(1)
          ts = json.loads(read("astra-plugin-sdk-ts/package.json"))["version"]

          fails = []
          def check(ok, msg):
              print(("ok   " if ok else "FAIL ") + msg)
              if not ok:
                  fails.append(msg)

          check(version == rust,
                f"the tag ({version}) is the Rust SDK's version ({rust})")
          check(macros == rust,
                f"astra-plugin-macros ({macros}) is the Rust SDK's version ({rust})")
          check(macros_dep == macros,
                f"the SDK's dependency on astra-plugin-macros ({macros_dep}) is "
                f"the version being published ({macros})")
          check(pyproject == dunder,
                f"pyproject ({pyproject}) == __version__ ({dunder})")
          for name, path, ver in (("rust", "astra-plugin-sdk/CHANGELOG.md", rust),
                                  ("python", "astra-plugin-sdk-python/CHANGELOG.md", pyproject),
                                  ("ts", "astra-plugin-sdk-ts/CHANGELOG.md", ts)):
              top = re.search(r"^## \[([^\]]+)\]", read(path), re.M)
              got = top.group(1) if top else "(none)"
              check(got == ver, f"{name} CHANGELOG's newest entry is {ver} (found {got})")

          if fails:
              sys.exit(f"\n{len(fails)} version disagreement(s); nothing was published.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\nrust={rust}\npython={pyproject}\nts={ts}\n")
              fh.write(f"publish={os.environ['DO_PUBLISH'].lower()}\n")
              # `all` on a tag push: a tag is always a whole release. Only a
              # workflow_dispatch can name a subset, and only a human can start
              # one.
              fh.write(f"registries={os.environ.get('REGISTRIES') or 'all'}\n")
          print(f"\nreleasing: rust {rust}, python {pyproject}, ts {ts}")
          PY

      # A version already on a registry is not publishable, and finding that out
      # after two of the three have gone up is the worst possible time. crates.io
      # and npm reject a duplicate; PyPI rejects it too, and none of them allows
      # a replacement — so this is the last moment the release can be abandoned
      # cleanly.
      - name: no package's version is already published
        env:
          RUST_V: ${{ steps.v.outputs.rust }}
          PY_V: ${{ steps.v.outputs.python }}
          REGISTRIES: ${{ steps.v.outputs.registries }}
          TS_V: ${{ steps.v.outputs.ts }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          UA = {"User-Agent": "AstraPlugins release CI (github.com/mihailinl/AstraPlugins)"}

          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA),
                                              timeout=30) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, b""

          fails = []

          # crates.io lists every version; a 404 means the crate itself is new.
          # Both Rust packages are checked: they ship from one tag at one version,
          # and `cargo publish` on the SDK resolves astra-plugin-macros from the
          # registry, so a duplicate on either one aborts the whole release.
          # Which registries this run is actually going to push to.
          #
          # **This exists because a partial release is a real state and the
          # workflow could not finish one.** On 2026-08-24 `sdk-v0.7.1` published
          # crates.io and PyPI and then failed on npm with a 404 on the PUT — an
          # expired publish token. Re-running was refused by this very gate,
          # correctly: crates.io and PyPI already had 0.7.1, and a gate that
          # shrugged at that would also shrug at an accidental re-tag.
          #
          # So the subset is NAMED by the person starting the run rather than
          # inferred. A tag push is always `all`; only a `workflow_dispatch` can
          # say `npm`, and saying it is a statement that the other legs are
          # already done. The gate still runs in full against whatever is named,
          # so `npm` alone still refuses if npm already has the version.
          selected = os.environ.get("REGISTRIES", "all") or "all"
          want = {"crates", "pypi", "npm"} if selected == "all" else set(
              x.strip() for x in selected.split(",") if x.strip())
          unknown = want - {"crates", "pypi", "npm"}
          if unknown:
              sys.exit(f"unknown registry name(s): {', '.join(sorted(unknown))}")
          if not want:
              sys.exit("no registry selected; nothing to do")
          for name in sorted({"crates", "pypi", "npm"} - want):
              print(f"note {name} NOT checked and NOT published — this run names "
                    f"'{selected}'. Finishing a partial release is the only reason to.")

          rust = os.environ["RUST_V"]
          for crate in (("astra-plugin-sdk", "astra-plugin-macros") if "crates" in want else ()):
              status, body = get(f"https://crates.io/api/v1/crates/{crate}")
              if status == 200:
                  published = {v["num"] for v in json.loads(body)["versions"]}
                  if rust in published:
                      fails.append(f"crates.io already has {crate} {rust}")
                  else:
                      print(f"ok   crates.io has {len(published)} version(s) of "
                            f"{crate}; {rust} is not one of them")
              elif status == 404:
                  print(f"ok   crates.io: {crate} has never been published")
              else:
                  fails.append(f"crates.io answered HTTP {status} for {crate}; "
                               "refusing to guess")

          # PyPI and npm both answer per-version, so a 404 IS the answer.
          per_registry = [
              ("pypi", "PyPI", f"https://pypi.org/pypi/astra-plugin-sdk/{os.environ['PY_V']}/json",
               os.environ["PY_V"]),
              ("npm", "npm", f"https://registry.npmjs.org/astra-plugin-sdk/{os.environ['TS_V']}",
               os.environ["TS_V"]),
          ]
          for key, name, url, ver in [r for r in per_registry if r[0] in want]:
              status, _ = get(url)
              if status == 200:
                  fails.append(f"{name} already has astra-plugin-sdk {ver}")
              elif status == 404:
                  print(f"ok   {name} does not have {ver}")
              else:
                  fails.append(f"{name} answered HTTP {status}; refusing to guess")

          if fails:
              print("\nA registry push cannot be undone or replaced, so this is the last",
                    file=sys.stderr)
              print("moment the release can be abandoned cleanly:\n", file=sys.stderr)
              for f in fails:
                  print("  FAIL " + f, file=sys.stderr)
              sys.exit(1)
          PY

  # ══ GATE 2 ═════════════════════════════════════════════════════════════════
  protocol:
    name: "gate 2: PROTOCOL_VERSION == PROTO_VERSION"
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # This is the number every plugin puts on the wire in
      # PluginRegisterRequest, and the number the daemon compares against its
      # floor. An SDK published with the wrong one negotiates a protocol nobody
      # implements, and the failure lands on the author, at run time.
      - name: the four declarations of the protocol integer agree
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^protocol=//p' proto/PROTO_VERSION | head -n1)
          rust=$(sed -n 's/.*PROTOCOL_VERSION: u32 = \([0-9]*\).*/\1/p' \
                 astra-plugin-sdk/src/protocol.rs | head -n1)
          py=$(sed -n 's/^PROTOCOL_VERSION = \([0-9]*\).*/\1/p' \
               astra-plugin-sdk-python/astra_plugin_sdk/protocol.py | head -n1)
          ts=$(sed -n 's/.*PROTOCOL_VERSION = \([0-9]*\).*/\1/p' \
               astra-plugin-sdk-ts/src/protocol.ts | head -n1)
          echo "PROTO_VERSION=$pinned rust=$rust python=$py ts=$ts"
          if [ "$pinned" != "$rust" ] || [ "$pinned" != "$py" ] || [ "$pinned" != "$ts" ]; then
            echo "FAIL the SDKs do not all speak protocol $pinned." >&2
            exit 1
          fi
          echo "ok   protocol $pinned, in all four places"

  # ══ GATE 3 ═════════════════════════════════════════════════════════════════
  proto-drift:
    name: "gate 3: proto drift"
    needs: protocol
    runs-on: ubuntu-24.04
    env:
      # Same hoist as ci.yml: the `secrets` context is unavailable in `if:`.
      HAVE_TOKEN: ${{ secrets.ASTRA_REPO_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - name: tools/check-proto.sh
        run: bash tools/check-proto.sh

      # A RELEASE may not run in degraded mode. On a pull request from a fork
      # that is an acceptable, stated limitation; here it would mean publishing
      # an SDK whose protocol nobody compared with the daemon. If the token is
      # missing, the release stops.
      - name: this release must verify against upstream
        run: |
          set -euo pipefail
          if [ "$HAVE_TOKEN" != yes ]; then
            echo "FAIL ASTRA_REPO_TOKEN is not set for this run." >&2
            echo "     ci.yml degrades to the ASTRA_PROTO.lock check on forks; a" >&2
            echo "     release does not get that concession — it would publish a" >&2
            echo "     protocol nobody had compared with the daemon." >&2
            exit 1
          fi

      # Same `ref` as ci.yml's proto-upstream, and for the same reason: the
      # slicer lands on Astra's feat/plugin-production before it reaches main,
      # and a checkout pinned to main gives this gate a tree with no slicer in
      # it. `vars.ASTRA_REF` overrides during that window; delete the variable
      # once the branch has merged.
      - uses: actions/checkout@v4
        with:
          repository: mihailinl/Astra
          ref: ${{ vars.ASTRA_REF || 'main' }}
          token: ${{ secrets.ASTRA_REPO_TOKEN }}
          path: _astra
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ github.token }}

      # `cargo: manifest path … does not exist` names a path and no cause. On a
      # release that is the difference between "point ASTRA_REF at the branch"
      # and half an hour of reading a stack of workflow files.
      - name: the Astra checkout carries the slicer
        # SECURITY: through `env`, never interpolated into the script — see the
        # same step in ci.yml.
        env:
          ASTRA_REF: ${{ vars.ASTRA_REF || 'main' }}
        run: |
          set -euo pipefail
          ref="$ASTRA_REF"
          for p in astra-rs/tools/proto-slice/Cargo.toml \
                   astra-rs/astra-proto/plugin-surface.toml \
                   astra-rs/astra-proto/src/astra.proto; do
            [ -f "_astra/$p" ] || {
              echo "FAIL mihailinl/Astra@$ref has no $p" >&2
              echo "     This gate regenerates proto/plugin.proto from Astra's astra.proto." >&2
              echo "     Set the repository variable ASTRA_REF to the branch carrying" >&2
              echo "     astra-rs/tools/proto-slice, and delete it once that has merged." >&2
              exit 1
            }
          done
          echo "ok   Astra@$ref carries the slicer and its surface file"

      - name: the checked-in protocol is the daemon's
        run: |
          set -euo pipefail
          cargo run --quiet \
            --manifest-path _astra/astra-rs/tools/proto-slice/Cargo.toml \
            -- --stdout > /tmp/upstream-plugin.proto
          if ! cmp -s /tmp/upstream-plugin.proto proto/plugin.proto; then
            echo "FAIL proto/plugin.proto is not what the daemon's proto slices to." >&2
            diff -u proto/plugin.proto /tmp/upstream-plugin.proto | head -60 >&2 || true
            exit 1
          fi
          echo "ok   proto/plugin.proto == the regenerated slice"

      - name: parity R5 (daemon_calls provenance)
        run: python3 tools/parity/check.py --rules R5 --astra-dir _astra/astra-rs

  # ══ GATE 4 ═════════════════════════════════════════════════════════════════
  parity:
    name: "gate 4: parity"
    needs: proto-drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/parity/gen.py --check
      - run: python tools/parity/check.py --rules R1,R2,R3,R4

  # ══ GATE 5 ═════════════════════════════════════════════════════════════════
  # The whole matrix, by calling ci.yml rather than restating it. A release must
  # not be able to run a weaker CI than a pull request does, and the only way to
  # guarantee that is for there to be one file.
  ci:
    name: "gate 5"
    needs: parity
    uses: ./.github/workflows/ci.yml
    secrets:
      ASTRA_REPO_TOKEN: ${{ secrets.ASTRA_REPO_TOKEN }}

  # ══ GATE 6 ═════════════════════════════════════════════════════════════════
  conformance:
    name: "gate 6: conformance"
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ github.token }}

      # spec/generated/conformance.json is the list of hooks a plugin must
      # answer, derived from spec/hooks.yaml. This gate checks both halves of it:
      #
      #   * the CONTRACT — the list is current, non-empty, and every `required`
      #     hook has a binding in every SDK the spec calls `stable` (parity R1,
      #     run again because a release is worth two seconds);
      #   * the RUNTIME — plugins in all three languages were started and every
      #     hook they declare was called, which is `astra-plugin test`.
      #
      # The runtime half used to be a tripwire: the harness did not exist, so the
      # step failed the moment `astra-plugin help test` started answering, and
      # said to wire a real run. It exists now, and it is wired — in gate 5,
      # which is where the 27 scaffolds live. The steps below read that run's
      # reports rather than repeat it, and are written so that "the job we depend
      # on did it" cannot degrade into a claim nobody checks.
      - name: the conformance list is current and non-empty
        run: |
          set -euo pipefail
          python tools/parity/gen.py --check
          python - <<'PY'
          import json, sys, pathlib
          spec = json.loads(pathlib.Path("spec/generated/conformance.json").read_text())
          hooks = spec["hooks"]
          if not hooks:
              sys.exit("conformance.json lists no hooks")
          required = [h for h in hooks if h["requirement"] == "required"]
          if not required:
              sys.exit("conformance.json lists no REQUIRED hook — the contract is empty")
          print(f"ok   {len(hooks)} hooks, {len(required)} required, protocol {spec['protocol']}")
          PY

      - name: every stable hook has a binding (parity R1)
        run: python tools/parity/check.py --rules R1

      # The runtime half, which the tripwire that used to sit here asked for.
      #
      # It is not run again here — it already ran, on this commit, in gate 5.
      # `ci` calls .github/workflows/ci.yml, whose `conformance (R7)` job
      # scaffolds all nine templates in all three languages, drives four
      # reference plugins, and calls every hook each one declares. Twenty-seven
      # scaffolds and thirty-one reports. Repeating that here would add a
      # quarter of an hour and prove the same thing twice.
      #
      # But "a job we depend on did it" is the kind of claim that quietly stops
      # being true, so this reads the EVIDENCE rather than the dependency: the
      # reports that job uploaded, re-checked against the spec. In particular
      # that job uploads with `if-no-files-found: warn`, so a run that produced
      # NO reports still ends green there — and would end red here.
      - name: the conformance reports from gate 5
        uses: actions/download-artifact@v4
        with:
          name: conformance-reports
          path: _conformance

      - name: three languages answered the contract, and the reports say so
        run: |
          set -euo pipefail
          count=$(find _conformance -name '*.json' -type f | wc -l)
          if [ "$count" -lt 10 ]; then
            echo "::error::gate 5 produced $count conformance report(s). That job drives" \
                 "31 plugins; a number this low means it did not run, or stopped early," \
                 "and this gate would otherwise pass on an empty directory."
            exit 1
          fi
          # Every language has to be represented. A regression that silently
          # dropped the Python or TypeScript leg would leave the count healthy.
          for lang in python typescript; do
            if ! ls _conformance/"$lang"-*.json >/dev/null 2>&1; then
              echo "::error::no $lang conformance report — that leg did not run"
              exit 1
            fi
          done
          # Rust reports are named for the template or the example, not the
          # language, so they are checked by one that only Rust produces.
          test -f _conformance/dice-roller.json \
            || { echo "::error::no report for the Rust reference plugin"; exit 1; }
          echo "ok   $count conformance report(s), all three languages present"

          args=()
          for report in _conformance/*.json; do args+=(--report "$report"); done
          python tools/parity/check.py --rules R7 "${args[@]}"

  # ══ GATE 7: PUBLISH ════════════════════════════════════════════════════════
  #
  # Three jobs, not one, so a registry outage on npm does not roll back a crate
  # that is already up (nothing can). They run in parallel: by this point every
  # gate has passed and the only remaining failure mode is the registry itself.

  publish-rust:
    name: "publish crates.io"
    needs: [versions, conformance]
    # The second clause is what lets a PARTIAL release be finished: gate 1
    # refuses a version a registry already has, so a re-run after a half-failed
    # release is blocked unless the operator names the leg that still has to go.
    if: >-
      needs.versions.outputs.publish == 'true' &&
      (needs.versions.outputs.registries == 'all' ||
       contains(needs.versions.outputs.registries, 'crates'))
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ github.token }}
      # TWO crates, in this order. The SDK depends on astra-plugin-macros by
      # `version = "…", path = "…"`; `cargo publish` ignores the path and
      # resolves the version from crates.io, so publishing the SDK first fails
      # with "no matching package named astra-plugin-macros" — after the tag has
      # been pushed and with nothing to roll back.
      - name: cargo publish (astra-plugin-macros — the SDK depends on it)
        working-directory: astra-plugin-macros
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `cargo publish` returns once the tarball is accepted, but the index the
      # next resolve reads is updated asynchronously. Without this wait the SDK
      # publish races it and fails on a crate that demonstrably exists.
      - name: wait for the index to carry it
        env:
          RUST_V: ${{ needs.versions.outputs.rust }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if cargo info "astra-plugin-macros@${RUST_V}" >/dev/null 2>&1; then
              echo "ok   crates.io index has astra-plugin-macros ${RUST_V} (after ${i} tries)"
              exit 0
            fi
            sleep 10
          done
          echo "FAIL astra-plugin-macros ${RUST_V} did not appear in the index" >&2
          echo "     It IS published. Re-run only this job once the index catches up;" >&2
          echo "     do not bump the version." >&2
          exit 1

      - name: cargo publish (astra-plugin-sdk)
        working-directory: astra-plugin-sdk
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-python:
    name: "publish PyPI"
    needs: [versions, conformance]
    # The second clause is what lets a PARTIAL release be finished: gate 1
    # refuses a version a registry already has, so a re-run after a half-failed
    # release is blocked unless the operator names the leg that still has to go.
    if: >-
      needs.versions.outputs.publish == 'true' &&
      (needs.versions.outputs.registries == 'all' ||
       contains(needs.versions.outputs.registries, 'pypi'))
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # trusted publishing (OIDC); no long-lived PyPI token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build
      - name: build sdist + wheel
        run: python -m build --outdir dist astra-plugin-sdk-python
      # The vendored proto is the reason this package can regenerate its stubs;
      # a wheel without it is a package whose documentation lies. Checked here
      # too, on the exact artifact about to be uploaded.
      - name: the artifacts carry the proto
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, sys, tarfile, zipfile
          want = "astra_plugin_sdk/proto/plugin.proto"
          whl = glob.glob("dist/*.whl")[0]
          assert want in zipfile.ZipFile(whl).namelist(), f"{want} missing from {whl}"
          sdist = glob.glob("dist/*.tar.gz")[0]
          names = tarfile.open(sdist).getnames()
          assert any(n.endswith(want) for n in names), f"{want} missing from {sdist}"
          print(f"ok   {whl} and {sdist} both carry the proto")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-ts:
    name: "publish npm"
    needs: [versions, conformance]
    # The second clause is what lets a PARTIAL release be finished: gate 1
    # refuses a version a registry already has, so a re-run after a half-failed
    # release is blocked unless the operator names the leg that still has to go.
    if: >-
      needs.versions.outputs.publish == 'true' &&
      (needs.versions.outputs.registries == 'all' ||
       contains(needs.versions.outputs.registries, 'npm'))
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: astra-plugin-sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # bun for the install (the committed lockfile is bun's), npm for the
      # publish (provenance attestation is an npm feature).
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Node 20 ships npm 10, and OIDC trusted publishing needs a newer npm than
      # that. Upgraded explicitly rather than by moving `node-version`, because
      # the Node version is a runtime decision for the SDK's own tests and this
      # is a publishing-tool decision; coupling them would make a routine Node
      # bump able to break the release, silently, months later.
      #
      # The version is PRINTED. An npm too old for trusted publishing fails at
      # the push with an auth error, which reads exactly like a misconfigured
      # trusted publisher on npmjs.com — two very different fixes behind one
      # message. The log now says which one it is before the attempt.
      # PINNED, and `@latest` is what this line used to say. That failed:
      #
      #   npm error code EBADENGINE
      #   Not compatible with your version of node/npm: npm@12.0.2
      #   Required: {"node":"^22.22.2 || ^24.15.0 || >=26.0.0"}
      #   Actual:   {"npm":"10.8.2","node":"v20.20.2"}
      #
      # `latest` is a moving target that can outrun the runtime it is being
      # installed onto, and it did within a day. 11.19.0 is the newest stable
      # 11.x whose engines still admit Node 20 (`^20.17.0 || >=22.9.0`), and
      # 11.5.1 is where trusted publishing arrived — so this pin is above the
      # feature floor and below the Node wall.
      #
      # **Move this pin when `node-version` moves, and not before.** They are
      # coupled through npm's `engines`, which is the one direction this file
      # cannot check for itself: an npm too NEW fails loudly here, and an npm
      # too OLD fails much later, at the push, with an auth error that reads
      # like a misconfigured publisher.
      - name: a publisher new enough for OIDC
        run: |
          npm install -g npm@11.19.0
          echo "npm $(npm --version), node $(node --version)"

      # **No token.** Authentication is OpenID Connect: the runner presents a
      # signed claim naming this repository, this workflow file and this
      # environment, and npmjs.com matches it against the trusted publisher
      # configured on the package. There is no long-lived credential to leak,
      # expire, or hold the wrong 2FA policy — which is what the two previous
      # failures were: `404 on PUT` (not authorised at all) and then `EOTP`
      # (authorised, but a token type that still wants a one-time code a CI
      # runner cannot produce).
      #
      # `id-token: write` above and `environment: npm` are both load-bearing.
      # The environment NAME is part of the claim, so it must equal the
      # "Environment name" field of the trusted publisher on npmjs.com. Blank
      # there against `npm` here is a mismatch and a refusal.
      - name: npm publish --provenance
        run: npm publish --provenance --access public

  # One place to look for "did the release go out", and the job branch protection
  # or a notification can watch.
  released:
    name: released
    if: always() && needs.versions.outputs.publish == 'true'
    needs: [versions, publish-rust, publish-python, publish-ts]
    runs-on: ubuntu-24.04
    steps:
      - name: summary
        env:
          NEEDS: ${{ toJSON(needs) }}
          VERSION: ${{ needs.versions.outputs.version }}
          REGISTRIES: ${{ needs.versions.outputs.registries }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          rows = {k: v["result"] for k, v in needs.items() if k.startswith("publish-")}

          # **`skipped` means two different things and they are opposite.**
          #
          # Before the `registries:` input existed, all three publish jobs ran on
          # every release, so "not success" was a complete test and skipped could
          # only mean an upstream gate had failed. Naming a subset broke that:
          # the first npm-only run published npm and then reported the release
          # FAILED, because crates.io and PyPI were skipped on purpose.
          #
          # The naive repair — treat skipped as fine — is worse than the bug. A
          # failed gate also skips these jobs, and then a release that published
          # nothing would report success.
          #
          # So the selection decides. A job skipped for a registry this run did
          # not name is expected; skipped for one it DID name is a failure, and
          # so is any non-success result.
          which = {"publish-rust": "crates", "publish-python": "pypi",
                   "publish-ts": "npm"}
          selected = os.environ.get("REGISTRIES") or "all"
          want = ({"crates", "pypi", "npm"} if selected == "all"
                  else {x.strip() for x in selected.split(",") if x.strip()})

          lines = [f"### Release `sdk-v{os.environ['VERSION']}`", ""]
          if selected != "all":
              lines += [f"Partial release: this run named `{selected}`.", ""]
          for k, v in sorted(rows.items()):
              note = "" if which[k] in want else " — not selected by this run"
              lines.append(f"* `{k}` — **{v}**{note}")

          bad = [k for k, v in rows.items()
                 if which[k] in want and v != "success"]
          unexpected = [k for k, v in rows.items()
                        if which[k] not in want and v not in ("skipped", "")]
          if unexpected:
              bad += unexpected
              lines += ["", "A publish job ran for a registry this run did not name."
                            " That should be impossible; do not trust this summary."]
          if bad:
              lines += ["", "One registry did not receive its package. A registry push"
                            " cannot be undone, so DO NOT retag: fix the failure and"
                            " re-run only the failed job."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          sys.exit(1 if bad else 0)
          PY
