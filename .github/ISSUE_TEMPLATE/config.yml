# Issue-template configuration for AstraPlugins.
#
# `blank_issues_enabled: false` is deliberate, and it is the fix for a specific
# failure. In the registry repository, blank issues were enabled and two real
# listing requests were opened *around* the template. A blank issue carries no
# labels; the triage bot only enters the submission path for an issue labelled
# `listing`; so nothing ran, nothing was posted, and both authors got total
# silence. The template is the only thing that applies the label, so bypassing
# the template has to be impossible rather than merely discouraged.
#
# The same trap applies to any label named in a template here: GitHub silently
# DROPS a label that does not exist in the repository. Only these exist today
# (`gh api repos/mihailinl/AstraPlugins/labels`):
#
#     bug  documentation  duplicate  enhancement
#     good first issue  help wanted  invalid  question  wontfix
#
# Before adding a `labels:` value to a form below, create the label in the
# repository first — otherwise the form looks correct and quietly applies
# nothing.
blank_issues_enabled: false

contact_links:
  - name: Get my plugin listed in the Astra store
    url: https://astra.minice.ai/plugins/_/submit
    about: >-
      Listing is the panel's, not GitHub's. Bind your repository to your Minice
      account (`astra-plugin init-ci --binding <token>`), tag a release CI
      built, then run `astra-plugin publish`: it opens this page with your
      repository and tag filled in, and you submit it signed in. A new release
      of a plugin already listed needs nothing — the registry detects the tag.

  - name: Report a listed plugin, or appeal a decision about one
    url: https://astra.minice.ai/plugins
    about: >-
      A plugin in the catalogue that is not what it says it is, or a yank,
      delist, deprecation or revocation you think is wrong. Both are made in
      the panel, on the plugin's page, signed in.

  - name: How do I write a plugin?
    url: https://github.com/mihailinl/AstraPlugins/blob/master/docs/en/2-tutorial/getting-started.md
    about: >-
      The tutorial, the SDK guides and the generated reference for the CLI, the
      manifest and the protocol. Read this before opening a question.

  # `CONTRIBUTING.md` carries a `## Security` heading, which GitHub slugs to
  # `#security`, and that section names the private address. A contact link
  # cannot be a `mailto:` reliably, so it points at the page that states it.
  - name: A security vulnerability
    url: https://github.com/mihailinl/AstraPlugins/blob/master/CONTRIBUTING.md#security
    about: >-
      Not a public issue. Write to security@minice.ai about a vulnerability in
      Astra, the daemon, the registry or the signing chain; that page says what
      the trust model does and does not promise.
