[package]
name = "astra-plugin-sdk"
version = "0.6.0"
edition = "2024"
description = "Rust SDK for building Astra plugins"
license = "MIT"
repository = "https://github.com/mihailinl/AstraPlugins"
homepage = "https://github.com/mihailinl/AstraPlugins"
documentation = "https://github.com/mihailinl/AstraPlugins/tree/master/docs/en"

[features]
# JSON Schema generation for tool arguments and plugin config.
#
# Default-on, because `#[tool] async fn roll(&self, ctx: &PluginContext, a: Roll)`
# has to answer "what does `Roll` look like?" for the model to call it at all,
# and the §3.1 authoring experience is one dependency and no feature flags. It
# is still a feature: `default-features = false` drops `schemars` for a plugin
# that hand-writes its schemas, and `#[tool]` then fails with a sentence naming
# the flag rather than a missing path (see `astra_plugin_sdk::schema`).
default = ["schema"]
schema = ["dep:schemars"]

[dependencies]
# The macro layer: `astra::main!`, `#[astra::plugin]`, `#[derive(PluginConfig)]`.
# Not optional. It is what makes a plugin one dependency, and a feature flag on
# it would mean two documented ways to write the same plugin.
astra-plugin-macros = { version = "0.6.0", path = "../astra-plugin-macros" }

# JSON Schema, for `#[tool]` argument types and `#[derive(PluginConfig)]`.
schemars = { version = "1", optional = true }

# gRPC
tonic = { version = "0.12", features = ["gzip"] }
prost = "0.13"

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"

# Lock-free shared state. `PluginContext` is cloned into every handler and every
# background task, and the daemon rewrites the language and the active-trigger
# set underneath them at arbitrary moments. A read has to be wait-free — the
# thing this replaces was `Mutex<Option<Arc<Mutex<HostClient>>>>` and a
# `try_lock` that silently dropped work when it lost the race.
arc-swap = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
async-trait = "0.1"

# CLI arg parsing (for --daemon-addr and --plugin-id)
clap = { version = "4", features = ["derive"] }

# Logging. `registry` is named explicitly and not left to `fmt` to pull in:
# `logging::layer` composes onto a `Registry`, and a plugin that builds the SDK
# with `default-features = false` on tracing-subscriber would otherwise lose the
# layer with an error about a trait bound rather than about a feature.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

[build-dependencies]
tonic-build = "0.12"
